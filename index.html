<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}*{box-sizing:border-box}img{max-width:100%}</style>
<title>Victoria Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Serif+KR:wght@700&display=swap">
<style>
/* Layout: 게임 허브 — 홈(4개 퀘스트 타일) → 각 퀘스트 화면. 한 화면에 한 가지 일만. */
:root{
  --bg:#E6F1FA; --card:#FFFFFF; --soft:#F1F6FB; --ink:#1E2940; --muted:#5B6782; --line:#C9D8E8; --lock:#AEB9CC;
  --accent:#2F6FEB; --good:#2E9E62; --bad:#D9485F;
  --cook:#F2A516; --hist:#E8664A; --hanja:#B8323F; --eng:#2F6FEB;
  --butter:#FFC93C; --crust:#C9822B; --cheese:#FFB627;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --han:"Noto Serif KR","AppleMyungjo","Batang",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121B2A; --card:#1C2739; --soft:#243149; --ink:#EEF2FA; --muted:#A3B0C8; --line:#2E3C55; --lock:#4A5872; --accent:#7AA5FF;
  --good:#4CC488; --bad:#FF7A8C; --hanja:#FF7D88; --eng:#7AA5FF; --hist:#FF8C70; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121B2A; --card:#1C2739; --soft:#243149; --ink:#EEF2FA; --muted:#A3B0C8; --line:#2E3C55; --lock:#4A5872; --accent:#7AA5FF;
  --good:#4CC488; --bad:#FF7A8C; --hanja:#FF7D88; --eng:#7AA5FF; --hist:#FF8C70; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
#app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.2} h2{font-size:1.6rem;line-height:1.3} h3{font-size:1.25rem}
p{margin:0}
button{font:inherit;color:inherit}
button:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;gap:12px}
.back{appearance:none;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 14px;cursor:pointer;font-family:var(--display)}
.hud{display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.pill{font-family:var(--display);font-size:1rem;color:var(--muted)}
.bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--butter);border-radius:99px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{appearance:none;text-align:left;border:3px solid var(--line);background:var(--card);border-radius:22px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;color:#fff}
.tile h3{font-size:1.3rem}
.tile .when{font-size:.95rem;color:var(--muted)}
.tile{position:relative}.heart{position:absolute;top:8px;right:10px;width:30px;height:30px;border-radius:50%;background:#FF4F8B;color:#fff;display:grid;place-items:center;font-size:1rem;box-shadow:0 2px 6px rgba(0,0,0,.2);animation:beat 1.2s ease-in-out infinite}@keyframes beat{50%{transform:scale(1.15)}}@media (prefers-reduced-motion:reduce){.heart{animation:none}}
.chip{align-self:flex-start;border-radius:99px;padding:2px 12px;font-family:var(--display);font-size:.95rem;background:var(--soft)}
.chip.go{background:var(--good);color:#fff}
.chip.done{background:var(--butter);color:#3A2A00}
.chip.wait{background:var(--soft);color:var(--muted)}
.card{background:var(--card);border-radius:22px;padding:18px;border:3px solid var(--line);display:flex;flex-direction:column;gap:14px}
.big{appearance:none;border:0;border-radius:18px;padding:14px 18px;font-family:var(--display);font-size:1.3rem;cursor:pointer;background:var(--good);color:#fff;width:100%}
.big.alt{background:var(--soft);color:var(--ink)}
.big:disabled{background:var(--lock);cursor:not-allowed}
.btns{display:flex;flex-direction:column;gap:10px}
.lock{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:24px 8px}
.lock .clock{font-family:var(--display);font-size:3rem;color:var(--accent);line-height:1}
/* 퀴즈 */
.qprog{display:flex;gap:6px}
.qprog i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.qprog i.ok{background:var(--good)} .qprog i.no{background:var(--bad)} .qprog i.now{background:var(--accent)}
.prompt{font-size:1.25rem;font-family:var(--display);text-align:center}
.prompt .hz{font-family:var(--han);font-size:5rem;line-height:1.1;display:block}
.prompt .em{font-size:4.5rem;line-height:1.1;display:block}
.prompt .word{font-family:var(--display);font-size:2.6rem;display:block}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{appearance:none;border:3px solid var(--line);background:var(--card);border-radius:18px;padding:12px 8px;cursor:pointer;font-family:var(--display);font-size:1.25rem;min-height:64px;display:grid;place-items:center;text-align:center}
.opt .hz{font-family:var(--han);font-size:2.4rem;line-height:1}
.opt .em{font-size:2.4rem;line-height:1}
.opt .word{font-size:2rem;line-height:1}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.opt:disabled{cursor:default;color:var(--ink)}
.say{appearance:none;border:2px solid var(--line);background:var(--soft);border-radius:99px;padding:6px 16px;cursor:pointer;font-family:var(--display);align-self:center}
.fb{border-radius:18px;padding:12px 14px;background:var(--soft);display:flex;gap:10px;align-items:flex-start}
.fb b{font-family:var(--display);font-weight:400}
.ava{flex:none;width:46px;height:46px;border-radius:50%;background:var(--hist);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:.95rem}
.bubble{min-width:0}
.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.stars{font-size:2.6rem;color:var(--cheese);letter-spacing:4px}
/* 카드 학습 */
.flash{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:10px 0}
.flash .hz{font-family:var(--han);font-size:7rem;line-height:1;color:var(--hanja)}
.flash .em{font-size:5.5rem;line-height:1}
.flash .word{font-family:var(--display);font-size:2.8rem;line-height:1.1}
.flash .mean{font-size:1.3rem;font-family:var(--display)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)} .dots i.on{background:var(--accent)}
.nav2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dday{font-family:var(--display);font-size:1.1rem;color:var(--hanja)}
/* 요리 */
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{appearance:none;border:3px solid var(--line);background:var(--card);border-radius:16px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;font-family:var(--display);font-size:.95rem}
.lv svg{width:100%;max-width:64px;height:auto}
.lv[aria-current="true"]{border-color:var(--accent)}
.lv.locked{color:var(--lock);cursor:not-allowed} .lv.locked svg{opacity:.3;filter:grayscale(1)}
.lv .st{font-size:.8rem;color:var(--cheese);min-height:1.2em}
.qhead{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center} .qhead>div{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chips li{background:var(--soft);border-radius:99px;padding:3px 12px;font-size:.95rem}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.steps li{background:var(--soft);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.steps b{font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--crust);line-height:1}
.timer{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:var(--soft);border-radius:16px;padding:12px}
.timer>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.safe{display:flex;flex-direction:column;gap:8px}
.safe label{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:10px 12px;cursor:pointer}
.safe input{width:22px;height:22px;flex:none;margin-top:3px;accent-color:var(--good)}
.rate{display:flex;gap:6px}
.rate button{appearance:none;border:0;background:none;font-size:2.3rem;line-height:1;cursor:pointer;color:var(--lock);padding:2px}
.rate button.on{color:var(--cheese)}
.chef{display:flex;gap:10px;align-items:center}.chefav{flex:none;width:64px;height:64px}.bubble2{position:relative;background:var(--soft);border-radius:16px;padding:10px 14px;font-family:var(--display);font-size:1.1rem;min-width:0}
.tapchips{display:flex;flex-wrap:wrap;gap:8px}.tc{appearance:none;border:3px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-family:var(--display);font-size:1.05rem;cursor:pointer}.tc.on{border-color:var(--good);background:var(--good);color:#fff}
.gauge{height:14px;border-radius:99px;background:var(--line);overflow:hidden}.gauge>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFC93C,#FF4F8B);border-radius:99px;transition:width .4s}
.csteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}.cs{appearance:none;width:100%;display:grid;grid-template-columns:40px 1fr 28px;gap:10px;align-items:center;text-align:left;border:3px solid var(--line);background:var(--card);border-radius:16px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink)}
.cs b{font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--crust);text-align:center}.cs span{min-width:0;display:flex;flex-direction:column}.cs em{font-style:normal;font-size:1.4rem;color:transparent}.cs small.wt{color:var(--muted);font-size:.9rem}
.cs:disabled{opacity:.45;cursor:default}.cs:not(:disabled):not(.ok){border-color:var(--accent);animation:pulse 1.4s ease-in-out infinite}.cs.ok{opacity:1;border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}.cs.ok em{color:var(--good)}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent)}}
.stamp{font-family:var(--display);font-size:1.4rem;line-height:1.2;color:#FF4F8B;border:4px solid #FF4F8B;border-radius:50%;width:130px;height:130px;display:grid;place-items:center;text-align:center;transform:rotate(-12deg);animation:stamp .5s ease-out}
@keyframes stamp{from{transform:scale(2.2) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}.confetti i{position:absolute;top:-12px;width:10px;height:14px;border-radius:3px;animation:fall 2.6s ease-in forwards}@keyframes fall{to{top:105%;transform:rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.cs:not(:disabled):not(.ok){animation:none}.stamp{animation:none}.gauge>i{transition:none}}
.qtag{display:table;margin-left:auto;margin-right:auto;font-family:var(--display);font-size:.95rem;background:var(--soft);color:var(--accent);border-radius:99px;padding:2px 12px;margin-bottom:6px}
.hintb{appearance:none;align-self:center;border:2px dashed var(--cheese);background:transparent;color:var(--ink);border-radius:99px;padding:6px 18px;font-family:var(--display);font-size:1.05rem;cursor:pointer}
.hintbox{background:color-mix(in srgb,var(--cheese) 18%,var(--card));border-radius:14px;padding:10px 14px;font-size:1.02rem}.hintbox b{font-family:var(--display);font-weight:400;color:var(--crust);margin-right:4px}
.combo{align-self:center;font-family:var(--display);color:#FF4F8B;font-size:1.1rem}
.ava.cat{background:#FFE3EF;padding:2px}.ava.cat svg{width:100%;height:100%}
.opt.pop{animation:pop .45s ease-out}.opt.shake{animation:shake .4s}
@keyframes pop{40%{transform:scale(1.08)}}@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.opt.pop,.opt.shake{animation:none}}
.art{width:100%;max-width:120px;height:auto}
.hud{position:relative}.gem{position:absolute;top:0;right:0;appearance:none;border:3px solid #9ED8FF;background:var(--card);border-radius:99px;padding:4px 14px;font-family:var(--display);font-size:1.25rem;cursor:pointer;color:var(--ink)}
.hud h1{padding-right:96px}.ttl{font-family:var(--display);color:#FF4F8B}
.pop-ov{position:fixed;inset:0;background:rgba(20,25,40,.55);display:grid;place-items:center;z-index:60;padding:16px}.pop-card{background:var(--card);color:var(--ink);border-radius:24px;padding:22px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;animation:pop .4s ease-out}
.bigem{font-size:4rem;line-height:1;animation:beat 1.2s ease-in-out infinite}.newcat{width:110px;height:110px}.newcat svg{width:100%;height:100%}
.wk{display:flex;gap:8px;font-size:1.8rem}.wk i{font-style:normal;opacity:.2;filter:grayscale(1)}.wk i.on{opacity:1;filter:none}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.catc{display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-size:.9rem}.catc svg{width:100%;max-width:70px;height:auto}.catc.lock{color:var(--lock)}
.rw{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}.rw li{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 12px}.rw b{font-family:var(--display);font-weight:400}.rw em{font-style:normal;font-size:.9rem;color:var(--muted)}.rw li.ok{background:color-mix(in srgb,var(--good) 16%,var(--card))}.rw li.ok em{color:var(--good)}
.dbl{font-family:var(--display);color:#FF4F8B;font-size:1.2rem}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}.rules li{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;background:var(--soft);border-radius:14px;padding:8px 10px}.rules b{font-family:var(--display);font-weight:400}.rules span{min-width:0;font-size:.98rem}
.pop-card{max-height:90vh;overflow-y:auto}.rulesb{appearance:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 14px;font-family:var(--display);font-size:1rem;cursor:pointer;align-self:flex-start}
.foot{text-align:center;font-size:.85rem;color:var(--muted);user-select:none;cursor:default}
.test{background:var(--bad);color:#fff;border-radius:12px;padding:6px 12px;text-align:center;font-family:var(--display)}
@media (max-width:480px){h1{font-size:1.7rem}.qhead{grid-template-columns:88px 1fr}.timer{grid-template-columns:72px 1fr}.tile h3{font-size:1.15rem}.tile .ic{width:46px;height:46px}}
</style>
</head>

<div id="app"></div>

<script>
/* ===================== 데이터 ===================== */
const NAME="Victoria";
const EXAM=new Date(2026,10,28); // 2026-11-28(토) 대한검정회 한자급수자격검정 제113회

// 한자 [한자, 훈, 음]
// 한자 52자 = 한국어문회 8급 50자(바빠 초등 8급 한자 순서) + 대한검정회 8급에만 있는 男·子
const HZ=[["日","날","일"],["月","달","월"],["火","불","화"],["水","물","수"],["木","나무","목"],["金","쇠","금"],["土","흙","토"],["外","바깥","외"],["寸","마디","촌"],["長","긴","장"],
["一","한","일"],["二","두","이"],["三","석","삼"],["四","넉","사"],["五","다섯","오"],["六","여섯","륙"],["七","일곱","칠"],["八","여덟","팔"],["九","아홉","구"],["十","열","십"],
["東","동녘","동"],["西","서녘","서"],["南","남녘","남"],["北","북녘","북"],["小","작을","소"],["門","문","문"],["山","메","산"],["中","가운데","중"],["靑","푸를","청"],["白","흰","백"],
["父","아비","부"],["母","어미","모"],["兄","형","형"],["弟","아우","제"],["先","먼저","선"],["生","날","생"],["學","배울","학"],["校","학교","교"],["敎","가르칠","교"],["室","집","실"],
["大","큰","대"],["韓","한국","한"],["民","백성","민"],["國","나라","국"],["軍","군사","군"],["人","사람","인"],["萬","일만","만"],["年","해","년"],["女","여자","녀"],["王","임금","왕"],

}

const hun=i=>HZ[i][1]+" "+HZ[i][2];

function hzLearnedChars(n){return HZDAYS.slice(0,n).flat().map(i=>HZ[i][0])}
function hzRevQs(d){const R=HZREVOF(d),L=hzLearnedChars(d+1),qs=[];shuffle(R).forEach((i,k)=>qs.push(hzQ(k%2?"B":"A",i,L)));const c=hzQ("C",0,L);if(c)qs.push(c);return shuffle(qs).slice(0,10)}
function hzDayQs(d){
  const F=HZDAYS[d],L=hzLearnedChars(d+1),prev=HZDAYS.slice(0,d).flat();const qs=[];
  F.forEach(i=>{qs.push(hzQ("A",i,L));qs.push(hzQ("B",i,L))});
  const extra=[hzQ("C",0,L),hzQ("D",0,L)].filter(Boolean);
  prev.length&&extra.push(hzQ("A",prev[Math.floor(Math.random()*prev.length)],L));
  while(qs.length<8){const e=extra.shift();if(e)qs.push(e);else{const pool=F.concat(prev);qs.push(hzQ(Math.random()<.5?"A":"B",pool[Math.floor(Math.random()*pool.length)],L))}}
  return shuffle(qs);
}
const EXAM30="九金南男女東六母木門父北四三西水十五月二人日一子弟七土八兄火";
function hzMixQs(n){const mock=n===25,L=mock?[...EXAM30]:HZ.map(h=>h[0]),qs=[];const plan=n===25?["A","A","A","A","A","A","A","A","B","B","B","B","B","B","B","B","C","C","C","C","C","C","D","D","D"]:["A","A","A","B","B","B","C","C","D","A"];
  const idx=shuffle(HZ.map((_,k)=>k).filter(k=>!mock||EXAM30.includes(HZ[k][0])));let p=0;plan.forEach(t=>{qs.push(hzQ(t,idx[p++%idx.length],L))});return shuffle(qs)}

function cho(s){const C="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";return [...s].map(c=>{const k=c.charCodeAt(0)-0xAC00;return k>=0&&k<11172?C[Math.floor(k/588)]:c}).join("")}
const tagH=t=>`<span class="qtag">${t}</span>`;

  const hintZ=`<b>기억 도우미</b> ${HZHINT[h[0]]||""}`;
  if(type==="A"){const w=pick(all,3,[i]);return mkQ(tagH("👀 한자 보고 맞히기")+hzSpan(h[0])+"이 한자의 뜻과 소리는?",hun(i),w.map(hun),`${h[0]} = ${hun(i)}${HZTIP[h[0]]?" · "+HZTIP[h[0]]:""}`,{hint:hintZ})}
  if(type==="B"){const w=pick(all,3,[i]);return mkQ(tagH("🔍 한자 찾기")+`<span class="word">${hun(i)}</span>알맞은 한자는?`,hzSpan(h[0]),w.map(k=>hzSpan(HZ[k][0])),`${hun(i)} = ${h[0]}`,{hint:hintZ})}
  if(type==="C"){const ok=HZWORD.filter(w=>[...w[0]].every(c=>learned.includes(c)));if(!ok.length)return null;const w=ok[Math.floor(Math.random()*ok.length)];
    const m=[...w[0]].map(c=>HZ.find(x=>x[0]===c)[1]);
    const wr=pick(HZWORD.map(x=>x[1]).filter(r=>r!==w[1]),3);
    return mkQ(tagH("🧩 낱말 읽기")+`<span class="hz" style="font-size:3.6rem">${w[0]}</span>어떻게 읽을까요?`,w[1],wr,`${w[0]} = ${w[1]} (${w[2]})`,{hint:`앞 글자는 '${m[0]}', 뒤 글자는 '${m[1]}'이라는 뜻이야. 각 글자의 소리를 떠올려 이어 봐!${w[0]==="六月"||w[0]==="十月"?" 조심! 이 낱말은 소리가 살짝 바뀌어.":""}`})}
  if(type==="D"){const ok=YOIL.filter(y=>learned.includes(y[1]));if(!ok.length)return null;const y=ok[Math.floor(Math.random()*ok.length)];
    const wr=pick(YOIL.map(x=>x[1]),3,[y[1]]);return mkQ(tagH("📅 요일 퀴즈")+`<span class="word">${y[0]}</span>의 '${y[0][0]}'은 어떤 한자?`,hzSpan(y[1]),wr.map(hzSpan),`${y[0]} = ${y[1]}요일`,{hint:`'${y[0][0]}'은 ${YOHINT[y[1]]}을 뜻해. 그 모양을 닮은 글자를 찾아봐!`})}
}
function enDayQs(d){
  const D=ENGDAYS[d];
  if(D.abc){const L=D.abc,all=ABC.map(a=>a[0]),qs=[];const idx=c=>all.indexOf(c);
    const near=c=>{const k=idx(c);return `알파벳 노래를 불러 봐: ${k>0?all[k-1]:"(처음)"} - ? - ${k<25?all[k+1]:"(끝)"}`};
    const q0=a=>mkQ(tagH("👂 듣고 맞히기")+"잘 듣고, 어떤 알파벳일까요?",`<span class="word">${a[0]}</span>`,pick(all,3,[a[0]]).map(x=>`<span class="word">${x}</span>`),`${a[0]} (${a[0].toLowerCase()})`,{say:a[0],hint:near(a[0])});
    L.forEach((a,k)=>{const t=k%3;
      if(t===0)qs.push(q0(a));
      if(t===1)qs.push(mkQ(tagH("🔡 짝꿍 찾기")+`<span class="word">${a[0]}</span>짝이 되는 소문자는?`,`<span class="word">${a[0].toLowerCase()}</span>`,pick(all,3,[a[0]]).map(x=>`<span class="word">${x.toLowerCase()}</span>`),`${a[0]} 의 소문자는 ${a[0].toLowerCase()}`,{hint:`${a[2]} 카드 기억나? 그 단어의 맨 앞 글자가 바로 소문자야.`}));
      if(t===2)qs.push(mkQ(tagH("🖼️ 그림 퀴즈")+`${emSpan(a[2])}${a[1]} 는 어떤 글자로 시작할까요?`,`<span class="word">${a[1][0].toUpperCase()}</span>`,pick(all,3,[a[1][0].toUpperCase()]).map(x=>`<span class="word">${x}</span>`),`${a[1]} = ${a[3]}`,{say:a[1],hint:`🔊 천천히 다시 들어 봐. 맨 처음 나는 소리에 집중!`}))});
    while(qs.length<10)qs.push(q0(L[Math.floor(Math.random()*L.length)]));
    return shuffle(qs).slice(0,10)}
  const W=D.words;
  return shuffle(W.map((w,k)=>{const others=pick(W.filter(x=>x!==w),3);const t=k%3;

    if(t===1)return mkQ(tagH("👂 듣고 맞히기")+"잘 듣고, 알맞은 그림을 고르세요",emSpan(w[1]),others.map(x=>emSpan(x[1])),`${w[0]} = ${w[2]}`,{say:w[0],hint:`뜻의 첫소리는 '${cho(w[2])[0]}'이야. 다시 들어 봐!`});
    return mkQ(tagH("📖 뜻 맞히기")+`<span class="word">${w[0]}</span>무슨 뜻일까요?`,w[2],others.map(x=>x[2]),`${w[0]} = ${w[2]}`,{say:w[0],hint:`뜻의 첫소리: ${cho(w[2])}`});
  }));
}
function enReviewQs(){const pool=THEMES.flatMap(t=>t[1]);const ws=[];shuffle(pool).forEach(w=>{if(ws.length<10&&!ws.some(x=>x[0]===w[0]))ws.push(w)});

<li><b>🐱 고양이 친구</b><span>보석을 받을 때마다 고양이 친구가 한 마리씩 와요 (12마리)</span></li>
<li><b>🎉 더블 포인트</b><span>퀴즈를 하나도 안 틀리면 XP가 두 배!</span></li>
<li><b>👑 왕관</b><span>한 주에 보석 5개를 모으면 이번 주 왕관</span></li>
<li><b>🔥 연속 배지</b><span>3일, 7일, 14일, 30일 연속으로 하면 배지</span></li>
<li><b>🎁 선물</b><span>보석 3개, 7개, 12개, 20개가 되면 엄마와 정한 선물</span></li>
</ol>
<p class="muted" style="text-align:left">⏰ 퀘스트는 매일 아침 7시에 열리고, 하루에 퀘스트마다 3개까지 할 수 있어요. 💡 모르면 힌트를 눌러 봐요!</p>`}
function showRules(){const o=document.createElement("div");o.className="pop-ov";o.innerHTML=`<div class="pop-card">${rulesHTML()}<button class="big" type="button">알겠어!</button></div>`;document.body.appendChild(o);o.querySelector("button").onclick=()=>{o.remove();if(!S.rulesSeen){S.rulesSeen=true;save()}}}
function cookStart(){const n=nextCook();S.cookCur=n?n.id:LEVELS.length;save();cook()}
const cOpen=id=>id===1||(S.cook[id-1]&&S.cook[id-1].clear);
function cook(){
  const cur=S.cookCur,l=LEVELS.find(x=>x.id===cur),s=S.cook[cur]||{};
  const preset=[1,3,5,10,15,30].includes(l.timer);
  const safe=l.safe||["🧤 장갑","🥢 집게","⌚ 타이머"].concat(cur===4?["🧼 손 씻기"]:[]);
  const steps=l.steps.concat([l.end||"토스터 끄고, 맛있게 먹기!"]);
  const tIdx=l.timer?steps.findIndex(t=>t.includes("타이머")):-1;
  app.innerHTML=hdr("아침 요리 퀘스트")+`
  <nav class="map" aria-label="레벨 선택">${LEVELS.map(x=>{const st=S.cook[x.id];return `<button class="lv${cOpen(x.id)?"":" locked"}" type="button" data-id="${x.id}" aria-current="${x.id===cur}" ${cOpen(x.id)?"":"disabled"}>${artSvg(x)}<span>Lv.${x.id}</span><span class="st">${st&&st.clear?"★".repeat(st.stars||1):cOpen(x.id)?"":"잠김"}</span></button>`}).join("")}</nav>
  <div class="card">
   <div class="qhead">${artSvg(l)}<div><span class="pill" style="color:var(--accent)">LEVEL ${l.id}${s.cook?` · ${s.cook}번 요리함`:""}</span><h2>${l.name}</h2><p class="muted">${l.sub}</p></div></div>
   <div class="chef"><div class="chefav">${chefSvg()}</div><div class="bubble2" id="cheer">셰프 냥이야! 준비물부터 챙겨 볼까?</div></div>
   <h3>1. 준비물 챙기기</h3><div class="tapchips" id="ing">${l.ing.map((t,i)=>`<button type="button" class="tc" data-i="${i}">${t}</button>`).join("")}</div>
   <h3>2. 안전 장비 착용</h3><div class="tapchips" id="safe">${safe.map((t,i)=>`<button type="button" class="tc" data-i="${i}">${t}</button>`).join("")}</div>
   <h3>3. 요리 시작! <span class="muted" style="font-size:.95rem">순서대로 눌러요</span></h3>
   <div class="gauge"><i id="gauge"></i></div>
   <ol class="csteps" id="steps">${steps.map((t,i)=>`<li><button type="button" class="cs" data-i="${i}" disabled><b>${i+1}</b><span>${t}${i===tIdx?`<small class="wt">⌚ 크라운을 꾹 누르고 "타이머 ${l.timer}분" ${preset?"":"(또는 타이머 앱 최근 항목)"}</small>`:""}</span><em>✓</em></button></li>`).join("")}</ol>
   <button class="big" id="go" type="button" disabled>완성!</button>
   <div id="after" hidden class="result">
     <div class="stamp">VICTORIA<br>CHEF ✓</div>
     <p class="pill" id="msg" style="color:var(--good)"></p>
     <h3>맛은 어땠어?</h3>
     <div class="rate">${[1,2,3].map(n=>`<button type="button" data-n="${n}" aria-label="별 ${n}개">★</button>`).join("")}</div>
     <div id="nextshop" style="width:100%;text-align:left"></div><button class="big" id="nextq" type="button"></button>
   </div>
  </div>`;
  bindBack();
  app.querySelectorAll(".lv").forEach(b=>b.onclick=()=>{S.cookCur=+b.dataset.id;save();cook()});
  const cheer=t=>{$("#cheer").textContent=t};
  const ingB=[...app.querySelectorAll("#ing .tc")],safeB=[...app.querySelectorAll("#safe .tc")],stepB=[...app.querySelectorAll("#steps .cs")];
  let done=0;
  function ready(){return ingB.every(b=>b.classList.contains("on"))&&safeB.every(b=>b.classList.contains("on"))}
  function refresh(){const r=ready();stepB.forEach((b,i)=>b.disabled=!r||i!==done);if(r&&done===0)cheer("준비 완벽해! 1번부터 눌러 봐.");$("#gauge").style.width=(done/steps.length*100)+"%";$("#go").disabled=done<steps.length}
  ingB.forEach(b=>b.onclick=()=>{b.classList.toggle("on");if(ingB.every(x=>x.classList.contains("on"))&&!ready())cheer("준비물 완료! 이제 안전 장비!");refresh()});
  safeB.forEach(b=>b.onclick=()=>{b.classList.toggle("on");refresh()});
  stepB.forEach((b,i)=>b.onclick=()=>{if(i!==done)return;b.classList.add("ok");done++;cheer(done===steps.length?"다 됐다! 완성 버튼 눌러 줘!":i===tIdx?"알람이 울릴 때까지 기다려~ 손목이 떨리면 다음!":CHEER[i%CHEER.length]);refresh()});
  refresh();
  $("#go").onclick=()=>{
    const st=S.cook[cur]=S.cook[cur]||{};st.cook=(st.cook||0)+1;const first=!st.clear;st.clear=true;const td0=today();S.cookDay=S.cookDay&&S.cookDay.d===td0?{d:td0,c:S.cookDay.c+1}:{d:td0,c:1};addXP(10);checkGem();
    $("#go").hidden=true;$("#after").hidden=false;confetti();cheer(first?`Lv.${cur} 클리어! 너 진짜 셰프다!`:"또 성공! 실력이 늘고 있어!");
    $("#msg").textContent=`+10 XP · ${st.cook}번째 요리${first&&cur<LEVELS.length?` · Lv.${cur+1} 열림!`:""}`;
    app.querySelectorAll(".lv").forEach(b=>{const id=+b.dataset.id;if(cOpen(id)){b.disabled=false;b.classList.remove("locked")}});
    const nx=cur<LEVELS.length?cur+1:null,nb=$("#nextq");nb.textContent=nx?`다음 퀘스트로 → Lv.${nx}`:"홈으로";
    const ns=nextCook();$("#nextshop").innerHTML=ns&&ns.id!==cur?shopHTML(ns).replace("card shop","shop"):"";
    nb.onclick=()=>{if(nx){S.cookCur=nx;save();cook();window.scrollTo(0,0)}else home()};
    $("#after").scrollIntoView({behavior:"smooth",block:"center"});
  };
  app.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{const st=S.cook[cur]=S.cook[cur]||{};st.stars=+b.dataset.n;save();app.querySelectorAll(".rate button").forEach(x=>x.classList.toggle("on",+x.dataset.n<=st.stars))});
}

home();
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{})}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&document.querySelector("#ver"))home()});
</script>
</body>
</html>
