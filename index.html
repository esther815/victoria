<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}*{box-sizing:border-box}img{max-width:100%}</style>
<title>Victoria Quest</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Serif+KR:wght@700&display=swap">
<style>
/* Layout: 게임 허브 — 홈(4개 퀘스트 타일) → 각 퀘스트 화면. 한 화면에 한 가지 일만. */
:root{
  --bg:#E6F1FA; --card:#FFFFFF; --soft:#F1F6FB; --ink:#1E2940; --muted:#5B6782; --line:#C9D8E8; --lock:#AEB9CC;
  --accent:#2F6FEB; --good:#2E9E62; --bad:#D9485F;
  --cook:#F2A516; --ko:#7C6CF0; --ma:#16A3A3; --sci:#F2A516;--so:#3B82C4; --hist:#E8664A; --hanja:#B8323F; --eng:#2F6FEB;
  --butter:#FFC93C; --crust:#C9822B; --cheese:#FFB627;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --han:"Noto Serif KR","AppleMyungjo","Batang",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121B2A; --card:#1C2739; --soft:#243149; --ink:#EEF2FA; --muted:#A3B0C8; --line:#2E3C55; --lock:#4A5872; --accent:#7AA5FF;
  --good:#4CC488; --bad:#FF7A8C; --hanja:#FF7D88; --eng:#7AA5FF; --hist:#FF8C70; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121B2A; --card:#1C2739; --soft:#243149; --ink:#EEF2FA; --muted:#A3B0C8; --line:#2E3C55; --lock:#4A5872; --accent:#7AA5FF;
  --good:#4CC488; --bad:#FF7A8C; --hanja:#FF7D88; --eng:#7AA5FF; --hist:#FF8C70; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
#app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.2} h2{font-size:1.6rem;line-height:1.3} h3{font-size:1.25rem}
p{margin:0}
button{font:inherit;color:inherit}
button:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;gap:12px}
.back{appearance:none;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 14px;cursor:pointer;font-family:var(--display)}
.hud{display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.pill{font-family:var(--display);font-size:1rem;color:var(--muted)}
.bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--butter);border-radius:99px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{appearance:none;text-align:left;border:3px solid var(--line);background:var(--card);border-radius:22px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;color:#fff}
.tile h3{font-size:1.3rem}
.tile .when{font-size:.95rem;color:var(--muted)}
.tile{position:relative}.heart{position:absolute;top:8px;right:10px;width:30px;height:30px;border-radius:50%;background:#FF4F8B;color:#fff;display:grid;place-items:center;font-size:1rem;box-shadow:0 2px 6px rgba(0,0,0,.2);animation:beat 1.2s ease-in-out infinite}@keyframes beat{50%{transform:scale(1.15)}}@media (prefers-reduced-motion:reduce){.heart{animation:none}}
.chip{align-self:flex-start;border-radius:99px;padding:2px 12px;font-family:var(--display);font-size:.95rem;background:var(--soft)}
.chip.go{background:var(--good);color:#fff}
.chip.done{background:var(--butter);color:#3A2A00}
.chip.wait{background:var(--soft);color:var(--muted)}
.card{background:var(--card);border-radius:22px;padding:18px;border:3px solid var(--line);display:flex;flex-direction:column;gap:14px}
.big{appearance:none;border:0;border-radius:18px;padding:14px 18px;font-family:var(--display);font-size:1.3rem;cursor:pointer;background:var(--good);color:#fff;width:100%}
.big.alt{background:var(--soft);color:var(--ink)}
.big:disabled{background:var(--lock);cursor:not-allowed}
.btns{display:flex;flex-direction:column;gap:10px}
.lock{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:24px 8px}
.lock .clock{font-family:var(--display);font-size:3rem;color:var(--accent);line-height:1}
/* 퀴즈 */
.qprog{display:flex;gap:6px}
.qprog i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.qprog i.ok{background:var(--good)} .qprog i.no{background:var(--bad)} .qprog i.now{background:var(--accent)}
.prompt{font-size:1.25rem;font-family:var(--display);text-align:center}
.prompt .hz{font-family:var(--han);font-size:5rem;line-height:1.1;display:block}
.prompt .em{font-size:4.5rem;line-height:1.1;display:block}
.prompt .word{font-family:var(--display);font-size:2.6rem;display:block}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{appearance:none;border:3px solid var(--line);background:var(--card);border-radius:18px;padding:12px 8px;cursor:pointer;font-family:var(--display);font-size:1.25rem;min-height:64px;display:grid;place-items:center;text-align:center}
.opt .hz{font-family:var(--han);font-size:2.4rem;line-height:1}
.opt .em{font-size:2.4rem;line-height:1}
.opt .word{font-size:2rem;line-height:1}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.opt:disabled{cursor:default;color:var(--ink)}
.say{appearance:none;border:2px solid var(--line);background:var(--soft);border-radius:99px;padding:6px 16px;cursor:pointer;font-family:var(--display);align-self:center}
.fb{border-radius:18px;padding:12px 14px;background:var(--soft);display:flex;gap:10px;align-items:flex-start}
.fb b{font-family:var(--display);font-weight:400}
.ava{flex:none;width:46px;height:46px;border-radius:50%;background:var(--hist);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:.95rem}
.bubble{min-width:0}
.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.stars{font-size:2.6rem;color:var(--cheese);letter-spacing:4px}
/* 카드 학습 */
.flash{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:10px 0}
.flash .hz{font-family:var(--han);font-size:7rem;line-height:1;color:var(--hanja)}
.flash .em{font-size:5.5rem;line-height:1}
.flash .word{font-family:var(--display);font-size:2.8rem;line-height:1.1}
.flash .mean{font-size:1.3rem;font-family:var(--display)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)} .dots i.on{background:var(--accent)}
.nav2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dday{font-family:var(--display);font-size:1.1rem;color:var(--hanja)}
/* 요리 */
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{appearance:none;border:3px solid var(--line);background:var(--card);border-radius:16px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;font-family:var(--display);font-size:.95rem}
.lv svg{width:100%;max-width:64px;height:auto}
.lv[aria-current="true"]{border-color:var(--accent)}
.lv.locked{color:var(--lock);cursor:not-allowed} .lv.locked svg{opacity:.3;filter:grayscale(1)}
.lv .st{font-size:.8rem;color:var(--cheese);min-height:1.2em}
.qhead{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center} .qhead>div{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chips li{background:var(--soft);border-radius:99px;padding:3px 12px;font-size:.95rem}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.steps li{background:var(--soft);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.steps b{font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--crust);line-height:1}
.timer{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:var(--soft);border-radius:16px;padding:12px}
.timer>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.safe{display:flex;flex-direction:column;gap:8px}
.safe label{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:10px 12px;cursor:pointer}
.safe input{width:22px;height:22px;flex:none;margin-top:3px;accent-color:var(--good)}
.rate{display:flex;gap:6px}
.rate button{appearance:none;border:0;background:none;font-size:2.3rem;line-height:1;cursor:pointer;color:var(--lock);padding:2px}
.rate button.on{color:var(--cheese)}
.chef{display:flex;gap:10px;align-items:center}.chefav{flex:none;width:64px;height:64px}.bubble2{position:relative;background:var(--soft);border-radius:16px;padding:10px 14px;font-family:var(--display);font-size:1.1rem;min-width:0}
.tapchips{display:flex;flex-wrap:wrap;gap:8px}.tc{appearance:none;border:3px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-family:var(--display);font-size:1.05rem;cursor:pointer}.tc.on{border-color:var(--good);background:var(--good);color:#fff}
.gauge{height:14px;border-radius:99px;background:var(--line);overflow:hidden}.gauge>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFC93C,#FF4F8B);border-radius:99px;transition:width .4s}
.csteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}.cs{appearance:none;width:100%;display:grid;grid-template-columns:40px 1fr 28px;gap:10px;align-items:center;text-align:left;border:3px solid var(--line);background:var(--card);border-radius:16px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink)}
.cs b{font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--crust);text-align:center}.cs span{min-width:0;display:flex;flex-direction:column}.cs em{font-style:normal;font-size:1.4rem;color:transparent}.cs small.wt{color:var(--muted);font-size:.9rem}
.cs:disabled{opacity:.45;cursor:default}.cs:not(:disabled):not(.ok){border-color:var(--accent);animation:pulse 1.4s ease-in-out infinite}.cs.ok{opacity:1;border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}.cs.ok em{color:var(--good)}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent)}}
.stamp{font-family:var(--display);font-size:1.4rem;line-height:1.2;color:#FF4F8B;border:4px solid #FF4F8B;border-radius:50%;width:130px;height:130px;display:grid;place-items:center;text-align:center;transform:rotate(-12deg);animation:stamp .5s ease-out}
@keyframes stamp{from{transform:scale(2.2) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}.confetti i{position:absolute;top:-12px;width:10px;height:14px;border-radius:3px;animation:fall 2.6s ease-in forwards}@keyframes fall{to{top:105%;transform:rotate(720deg)}}

.steps{display:flex;gap:6px;justify-content:center;margin-top:10px}.steps i{width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-style:normal;font-family:var(--display);color:var(--muted)}.steps i.on{background:#FF7AB0;color:#fff}

{t:"고구려의 영웅들",q:[15,16,17],c:[["🐎","고구려 광개토 대왕은 말을 달려 땅을 아주 넓게 넓혔어. 아들 장수왕은 아버지의 업적을 커다란 비석에 새겼는데, 이게 광개토 대왕릉비야."],["🏙️","장수왕은 427년에 수도를 평양으로 옮기고 남쪽으로 더 나아갔어."],["🌊","수나라가 엄청난 군대로 쳐들어왔을 때, 을지문덕 장군은 살수(청천강)에서 수나라 군대를 크게 무찔렀어. 이게 살수 대첩이야."]]},

{t:"첨성대와 골품제",q:[28,29],c:[["🔭","경주의 첨성대는 선덕 여왕 때 세웠다고 전해지는 별 관측대야."],["🦴","신라에는 골품제가 있었어. 태어난 집안(혈통)에 따라 신분을 나누고, 할 수 있는 일도 달랐대."]]},

function histLesson(n,practice){const L=HSTORY[n];let k=0;

  card()}
function startHist(practice){

}

function hzDayQs(d){
  const F=HZDAYS[d],L=hzLearnedChars(d+1),prev=HZDAYS.slice(0,d).flat();const qs=[];
  F.forEach(i=>{qs.push(hzQ("A",i,L));qs.push(hzQ("B",i,L))});
  const extra=[hzQ("C",0,L),hzQ("D",0,L)].filter(Boolean);
  prev.length&&extra.push(hzQ("A",prev[Math.floor(Math.random()*prev.length)],L));
  while(qs.length<8){const e=extra.shift();if(e)qs.push(e);else{const pool=F.concat(prev);qs.push(hzQ(Math.random()<.5?"A":"B",pool[Math.floor(Math.random()*pool.length)],L))}}
  return shuffle(qs);
}

   ${p[1]?`<p class="hzsrc">옛 글자는 갑골문·금문 모양을 알아보기 쉽게 단순화해 그렸어요.</p>`:`<p class="hzsrc">이 그림은 뜻을 기억하기 쉽게 돕는 그림이에요.</p>`}</div>`}
function hzSpeak(c){const h=HZ.find(x=>x[0]===c),st=HZSTORY[c],parts=HZPARTS[c];let t=`${c}, ${h[1]} ${h[2]}. `;if(parts)t+=parts.map(p=>p[1]).join(" 더하기 ")+". ";if(st)t+=st[1].replace(/\([^)]*\)/g,"").replace(/[一-鿿]/g,"");sayKo(t)}
function bindPicCards(root){(root||app).querySelectorAll(".hzpc").forEach(el=>{const c=el.dataset.c;const b=el.querySelector("[data-say]");if(b)b.onclick=()=>hzSpeak(c);const r=el.querySelector("[data-replay]");if(r)r.onclick=()=>{el.classList.remove("play");void el.offsetWidth;el.classList.add("play")};el.classList.add("play");
  if(hzHard(c)&&!el.classList.contains("hidech")&&!el.dataset.spoke){el.dataset.spoke=1;setTimeout(()=>{if(document.body.contains(el))hzSpeak(c)},2200)}})}

const HZ_FOCUS_SEED="母校南韓靑四學東小山北年外先敎弟軍室兄女王生八國民大西";
function hzF(){S.hz.focus=S.hz.focus||{};if(!S.hz.focusSeeded){[...HZ_FOCUS_SEED].forEach(c=>{if(HZ.some(h=>h[0]===c)&&!S.hz.focus[c])S.hz.focus[c]={days:[],ok:0,miss:0}});S.hz.focusSeeded=true;save()}return S.hz.focus}
const hzFDone=c=>{const f=hzF()[c];return f&&f.days.length>=3};
function hzFList(){return Object.keys(hzF()).filter(c=>!hzFDone(c))}
function hzFMark(c,ok){const f=hzF()[c];if(!f)return;const td=today();if(ok){f.ok++;if(!f.days.includes(td)){f.days.push(td);if(f.days.length===3){S.gems=(S.gems||0)+1;setTimeout(()=>toast(`🎉 ${c} 완전히 외웠어! 💎+1`),400)}}}else{f.miss++;f.days=f.days.slice(0,Math.max(0,f.days.length-1))}save()}
function hzFQs(n=10){const list=shuffle(hzFList()),pick=[];while(pick.length<Math.min(n,Math.max(list.length,1)*2)&&list.length)pick.push(list[pick.length%list.length]);
  return pick.slice(0,n).map((c,i)=>{const h=HZ.find(x=>x[0]===c),others=shuffle(HZ.filter(x=>x[0]!==c)).slice(0,3),st=HZSTORY[c];
    if(i%3===2&&HZP[c]&&HZP[c][1])return mkQ(`<span class="qtag">🖼️ 그림 퀴즈</span>${hzSvg(HZP[c][0],"qpic")}<br>이 그림에서 온 한자는?`,`<span class="hz sm">${c}</span>`,others.map(o=>`<span class="hz sm">${o[0]}</span>`),`${c} = ${h[1]} ${h[2]}${st?" · "+st[1]:""}`,{hint:"그림의 모양이 한자 어디에 남아 있는지 찾아봐!",fc:c});
    return i%2?mkQ(`<span class="qtag">🔁 집중 반복</span>‘<b>${h[1]} ${h[2]}</b>’에 알맞은 한자는?`,`<span class="hz sm">${c}</span>`,others.map(o=>`<span class="hz sm">${o[0]}</span>`),`${c} = ${h[1]} ${h[2]}${st?" · "+st[1]:""}`,{hint:st?`${st[0]} ${st[1]}`:"모양을 떠올려 봐!",fc:c})
      :mkQ(`<span class="qtag">🔁 집중 반복</span><span class="hz">${c}</span><br>이 한자의 뜻과 소리는?`,`${h[1]} ${h[2]}`,others.map(o=>`${o[1]} ${o[2]}`),`${c} = ${h[1]} ${h[2]}${st?" · "+st[1]:""}`,{hint:st?`${st[0]} ${st[1]}`:"뜻을 먼저 떠올리고, 소리를 맞혀 봐.",fc:c})})}
function hzFocusCard(){const all=Object.keys(hzF()),left=hzFList();if(!all.length)return "";return `<div class="card"><div class="row"><h3>🔁 모르는 한자 집중 반복</h3><span class="pill">외운 한자 ${all.length-left.length} / ${all.length}</span></div>
  <div class="hzchips">${all.map(c=>`<span class="hzc ${hzFDone(c)?"on":""}">${c}<small>${"●".repeat(hzF()[c].days.length)}${"○".repeat(Math.max(0,3-hzF()[c].days.length))}</small></span>`).join("")}</div>
  <p class="muted">서로 다른 날 3번 맞히면 ⭐ 외움! (●○○) 틀리면 한 칸 뒤로. 한 글자 외울 때마다 💎+1</p>
  ${left.length?`<div class="btns2"><button class="big" id="hzf" type="button">집중 반복 10문제</button><button class="big alt" id="hzfc" type="button">🃏 카드 넘기기</button></div>`:`<p class="pill">🌟 모두 외웠어요!</p>`}</div>`}
function hzFlip(){const list=shuffle(hzFList());let i=0,flip=false;const draw=()=>{if(i>=list.length){toast("🃏 카드 한 바퀴 끝! 이제 10문제로 확인해 봐");return hz()}const c=list[i],h=HZ.find(x=>x[0]===c),st=HZSTORY[c];

function hzLearn(d,practice){
  const F=HZDAYS[d];let k=0;
  if(!F.length){quiz({title:"한자 복습 퀘스트",qs:hzRevQs(d),pass:7,remake:()=>hzRevQs(d),onPass:()=>{if(!practice&&!doneToday("hz")){markDone("hz");addXP(20)}}});return}
  function card(){const i=F[k],h=HZ[i];const ex=HZWORD.filter(w=>w[0].includes(h[0])&&[...w[0]].every(c=>hzLearnedChars(d+1).includes(c)))[0];
    app.innerHTML=hdr("한자 카드")+`<div class="card"><div class="dots">${F.map((_,j)=>`<i class="${j===k?"on":""}"></i>`).join("")}</div>
     <div class="flash"><span class="hz">${h[0]}</span><span class="word">${h[1]} ${h[2]}</span>${HZP[h[0]]?hzPicCard(h[0]):HZSTORY[h[0]]?`<div class="story"><span class="badge">${HZSTORY[h[0]][2]==="pic"?"🖼️ 그림에서 온 글자":"📜 전해지는 이야기"}</span><div class="pic"><span>${HZSTORY[h[0]][0]}</span><span>→</span><span class="hz2">${h[0]}</span></div><p style="margin:0">${HZSTORY[h[0]][1]}</p></div>`:""}${HZTIP[h[0]]?`<p class="muted">${HZTIP[h[0]]}</p>`:""}${ex?`<p class="mean">${ex[0]} = ${ex[1]} <span class="muted">(${ex[2]})</span></p>`:""}</div>
     <p class="muted" style="text-align:center">소리 내어 "${h[1]} ${h[2]}" 세 번 말해 보세요!</p>
     <div class="nav2"><button class="big alt" id="prev" type="button" ${k===0?"disabled":""}>이전</button><button class="big" id="nx" type="button">${k<F.length-1?"다음 카드":"퀴즈 시작!"}</button></div></div>`;
    bindBack();bindPicCards();$("#prev").onclick=()=>{k--;card()};$("#nx").onclick=()=>{if(k<F.length-1){k++;card()}else go()}}
  function go(){quiz({title:"한자 퀘스트",qs:hzDayQs(d),pass:6,remake:()=>hzDayQs(d),onPass:()=>{if(!practice&&!doneToday("hz")){markDone("hz");addXP(20)}}})}
  card();
}

  else{if(careHearts()<1)return;S.care.used++;
    if(a==="play"){p.love=Math.min(100,p.love+6);msg=`${P[2]} 신나게 놀았어요! 친밀도 +6`}
    if(a==="care"){p.love=Math.min(100,p.love+4);msg=`${P[2]} 깨끗하고 기분 좋아요! 친밀도 +4`}
    if(a==="train"){p.skill++;p.love=Math.min(100,p.love+2);const j=TRICK_AT.indexOf(p.skill);msg=j>=0?`🎉 ${esc(p.name)}가 새 재주 “${P[6][j]}”를 배웠어요!`:`${P[2]} 열심히 배웠어요! 다음 재주까지 교육 ${(TRICK_AT.find(x=>x>p.skill)||p.skill)-p.skill}번`;if(j>=0)try{confetti()}catch(e){}}}

function babyAge(){const b=S.baby;return b?Math.floor(b.careDays/((b.speed)||3)):0}
function babyStage(){const m=babyAge();let k=0;BABY_STAGES.forEach((s,i)=>{if(m>=s[0])k=i});return k}

 w:"띄어쓰기를 잘못하면 뜻이 바뀌는 문장을 하나 생각해서 써 봐."},
{c:"6국04-06",a:"문법",t:"헷갈리는 말 바로잡기",cards:[["🔁","<b>되/돼</b>: ‘되어’로 바꿔서 말이 되면 ‘돼’! (가도 돼 = 가도 되어)"],["🙅","<b>안/않</b>: ‘안’은 말 앞에(안 먹다), ‘않’은 ‘-지 않다’로(먹지 않다)."],["🎯","<b>맞히다</b>: 정답을 맞히다 · <b>맞추다</b>: 퍼즐을 맞추다, 답을 서로 비교하다<br><b>바라다</b>: 건강하길 바라(○) 바래(×)"]],
 qs:[["“이제 집에 가도 ____?”","돼",["되","대","되요"],"‘되어’를 넣어 봐. “가도 되어?” 말이 되지?","‘되어’가 줄면 ‘돼’야."],
 ["“나는 숙제를 ____ 했다.”","안",["않","않는","안는"],"말 앞에 붙는 짧은 말이야.","‘안 하다’ — ‘안’은 서술어 앞에 써."],
 ["“퀴즈 정답을 모두 ____.”","맞혔다",["맞췄다","마쳤다","맞었다"],"정답을 ‘알아낸’ 것이야.","정답을 알아내는 건 ‘맞히다’야."],
 ["“할머니가 건강하시길 ____.”","바라",["바래","바레","바뤠"],"기본형이 ‘바라다’야.","‘바라다’ → ‘바라’. ‘바래다’는 색이 변한다는 뜻이야."]],
 w:"오늘 배운 헷갈리는 말 하나를 넣어 문장을 써 봐."},
{c:"6국04-03",a:"문법",t:"우리 고유어",cards:[["🌱","<b>고유어</b>는 원래부터 우리말에 있던 말이에요. 하늘, 바다, 마음, 나이, 집…"],["🏛️","<b>한자어</b>는 한자로 만든 말이에요. 학교(學校), 공책(空冊), 연령(年齡)…"],["💗","고유어에는 우리 겨레가 오래 써 온 생각과 느낌이 담겨 있어요."]],
 qs:[["다음 중 <b>고유어</b>는?","하늘",["학교","공책","도서관"],"한자로 쓸 수 있는 말을 하나씩 빼 봐.","학교·공책·도서관은 한자어, ‘하늘’은 고유어야."],
 ["‘연령’을 고유어로 바꾸면?","나이",["연세","세월","시간"],"“몇 살이야?” 할 때 쓰는 말이야.","‘연령’과 같은 뜻의 고유어는 ‘나이’."],
 ["‘가옥’을 고유어로 바꾸면?","집",["주택","건물","가정"],"우리가 사는 곳을 가리키는 가장 쉬운 말.","‘가옥’은 한자어, 같은 뜻의 고유어는 ‘집’."],
 ["고유어를 아껴 써야 하는 까닭으로 알맞은 것은?","우리 겨레의 생각과 느낌이 담겨 있어서",["한자어보다 항상 짧아서","외국어보다 어려워서","시험에 많이 나와서"],"고유어가 오래 이어져 온 말이라는 점을 떠올려 봐.","고유어에는 우리 문화와 정서가 담겨 있어."]],
 w:"내가 좋아하는 고유어 하나와 그 까닭을 써 봐."},
{c:"6국04-03",a:"문법",t:"관용 표현",cards:[["🧠","<b>관용 표현</b>은 두 단어 이상이 합쳐져 원래 뜻과 다른 새 뜻으로 굳어진 말이에요."],["👂","“귀가 얇다” = 귀가 정말 얇은 게 아니라 <b>남의 말을 쉽게 믿는다</b>는 뜻!"],["✨","상황에 맞게 쓰면 말이 생생하고 짧아져요."]],
 qs:[["“우리 이모는 <b>발이 넓다</b>.”의 뜻은?","아는 사람이 많다",["발이 크다","걸음이 빠르다","여행을 자주 간다"],"발 크기 이야기가 아니야. 사람 사이를 떠올려 봐.","‘발이 넓다’는 사귀어 아는 사람이 많다는 뜻."],
 ["“할머니는 <b>손이 크셔서</b> 음식을 잔뜩 하신다.”의 뜻은?","씀씀이가 넉넉하다",["손바닥이 크다","힘이 세다","요리를 잘한다"],"음식을 ‘잔뜩’ 하신다는 말에서 힌트를 찾아봐.","‘손이 크다’는 무엇을 넉넉하게 쓰거나 만든다는 뜻."],
 ["비밀을 잘 지키는 친구에게 어울리는 말은?","입이 무겁다",["입이 짧다","귀가 얇다","발이 넓다"],"말을 쉽게 옮기지 않는 모습이야.","‘입이 무겁다’는 말을 함부로 옮기지 않는다는 뜻."],
 ["시험 기간에 숙제까지 겹친 상황에 어울리는 말은?","눈코 뜰 새 없다",["손이 크다","입이 짧다","발이 넓다"],"아주아주 바쁜 상황이야.","‘눈코 뜰 새 없다’는 정신없이 바쁘다는 뜻."]],
 w:"오늘 배운 관용 표현 하나로 나에게 있었던 일을 써 봐."},
{c:"6국04-02",a:"문법",t:"표준어와 방언",cards:[["🗺️","<b>방언</b>은 지역마다 다르게 쓰는 말이에요. 제주에서는 “혼저 옵서예!” = “어서 오세요!”"],["📺","<b>표준어</b>는 여러 지역 사람이 함께 정확히 알아듣도록 정한 말이에요. 뉴스, 교과서, 공식 자리에서 써요."],["🤝","방언은 같은 지역 사람끼리 정을 느끼게 하고, 그 지역의 문화를 담고 있어요. 둘 다 소중해요!"]],
 qs:[["제주 방언 “혼저 옵서예”의 뜻은?","어서 오세요",["안녕히 가세요","밥 먹었니?","고맙습니다"],"손님을 맞이할 때 하는 말이야.","‘혼저 옵서예’는 ‘어서 오세요’라는 제주 방언."],
 ["<b>표준어</b>를 쓰는 것이 더 알맞은 상황은?","전국에 나가는 뉴스를 진행할 때",["고향 친구와 전화할 때","할머니 댁에서 이야기할 때","같은 동네 친구와 놀 때"],"여러 지역 사람이 모두 듣는 상황을 찾아봐.","여러 지역 사람이 함께 들을 때는 표준어가 정확히 통해."],
 ["방언의 좋은 점으로 알맞은 것은?","같은 지역 사람끼리 친근감을 느끼게 한다",["모든 사람이 똑같이 알아듣는다","시험에서 꼭 써야 한다","표준어보다 항상 짧다"],"고향 말을 들으면 어떤 기분이 들까?","방언은 친근감을 주고 지역 문화를 담고 있어."],
 ["표준어와 방언에 대한 생각으로 가장 알맞은 것은?","상황에 따라 알맞게 골라 쓴다",["방언은 틀린 말이니 쓰지 않는다","표준어는 필요 없다","방언은 어른만 쓴다"],"둘 다 하는 일이 있었지?","표준어와 방언은 각자 쓰임이 있어서 상황에 맞게 쓰면 돼."]],
 w:"우리 가족이나 친척이 쓰는 지역 말이 있다면 써 보고, 뜻도 적어 봐."},
{c:"6국02-01",a:"읽기",t:"글의 짜임 알아보기",cards:[["🏗️","글에는 짜임(구조)이 있어요. 짜임을 알면 내용이 한눈에 들어와요."],["⚖️","<b>비교·대조</b>: 두 대상의 같은 점과 다른 점<br><b>원인·결과</b>: 왜 그런 일이 일어났는지<br><b>문제·해결</b>: 어떤 문제와 그 해결 방법"],["📝","요약할 때는 짜임에 맞춰 중요한 내용만 남겨요."]],
 qs:[["“고양이와 개는 모두 사람과 함께 사는 동물이다. 하지만 고양이는 혼자 있는 시간을 잘 견디고, 개는 사람과 함께 움직이기를 좋아한다.” 이 글의 짜임은?","비교·대조",["원인·결과","문제·해결","시간 순서"],"‘모두’, ‘하지만’이라는 말이 무엇을 보여 주지?","같은 점(모두)과 다른 점(하지만)을 말하니 비교·대조."],
 ["“밤늦게까지 휴대 전화를 보았다. 그래서 아침에 일어나기 힘들었다.” 이 글의 짜임은?","원인·결과",["비교·대조","문제·해결","설명·예시"],"‘그래서’ 앞과 뒤의 관계를 생각해 봐.","앞이 까닭(원인), 뒤가 일어난 일(결과)이야."],
 ["“교실 쓰레기통이 늘 넘친다. 그래서 우리 반은 분리배출 당번을 정하기로 했다.” 이 글의 짜임은?","문제·해결",["비교·대조","원인·결과","시간 순서"],"어떤 어려움이 있고, 어떻게 하기로 했지?","넘치는 쓰레기통(문제) → 당번 정하기(해결)."],
 ["첫 번째 글(고양이와 개)을 가장 잘 요약한 것은?","고양이와 개는 사람과 함께 살지만 생활 습관이 다르다.",["고양이는 혼자 있는 것을 좋아한다.","개는 산책을 좋아한다.","동물은 모두 귀엽다."],"같은 점과 다른 점이 모두 들어간 문장을 골라.","요약은 짜임(같은 점+다른 점)을 살려야 해."]],
 w:"좋아하는 두 가지(음식, 계절 등)를 비교·대조하는 글을 두 문장으로 써 봐."},
{c:"6국02-01",a:"읽기",t:"주장 찾고 요약하기",cards:[["📣","<b>주장</b>은 글쓴이가 “이렇게 하자!” 하고 말하고 싶은 생각이에요."],["🧱","<b>근거</b>는 주장을 믿을 수 있게 받쳐 주는 까닭이에요."],["✂️","요약: 주장 한 문장 + 핵심 근거만 남기기!"]],
 qs:[["“아침밥을 꼭 먹자. 아침을 먹으면 오전에 집중이 잘된다. 또 점심 전에 군것질을 덜 하게 된다.” 글쓴이의 <b>주장</b>은?","아침밥을 꼭 먹자.",["오전에 집중이 잘된다.","군것질을 덜 하게 된다.","점심을 많이 먹자."],"글쓴이가 ‘하자’고 하는 말을 찾아봐.","‘아침밥을 꼭 먹자’가 주장이고, 나머지는 근거야."],
 ["위 글에서 <b>근거</b>에 해당하는 것은?","아침을 먹으면 오전에 집중이 잘된다.",["아침밥을 꼭 먹자.","아침에는 늦잠을 자자.","점심은 굶자."],"주장을 믿게 해 주는 까닭이야.","집중이 잘된다는 것은 아침을 먹어야 하는 까닭이야."],
 ["위 글을 가장 잘 요약한 것은?","집중이 잘되고 군것질을 줄여 주니 아침밥을 먹자.",["아침밥은 맛있다.","군것질은 나쁘다.","오전에는 집중해야 한다."],"주장과 근거가 모두 들어 있는지 봐.","요약은 주장 + 핵심 근거."],
 ["주장하는 글을 읽을 때 가장 먼저 찾아야 할 것은?","글쓴이가 말하고 싶은 주장",["글의 길이","어려운 낱말","글쓴이의 이름"],"‘무엇을 하자는 거지?’","주장을 먼저 찾아야 근거가 맞는지도 따질 수 있어."]],
 w:"‘~하자’로 끝나는 내 주장 하나와 근거 두 개를 써 봐."},
{c:"6국02-02",a:"읽기",t:"숨은 내용 추론하기",cards:[["🕵️","글에는 다 쓰지 않은 내용이 있어요. 앞뒤 문장을 단서로 <b>생략된 내용</b>을 알아내는 걸 <b>추론</b>이라고 해요."],["🧩","단서 + 내가 아는 것 = 추론!"],["⚠️","추론은 글에 있는 단서에 근거해야 해요. 상상만으로 정하면 안 돼요."]],
 qs:[["“민지는 우산을 챙기지 않았다. 학교에서 돌아온 민지의 옷은 흠뻑 젖어 있었다.” 생략된 내용은?","돌아오는 길에 비가 왔다.",["민지가 수영을 했다.","민지가 우산을 잃어버렸다.","민지가 물놀이를 좋아한다."],"우산과 젖은 옷, 두 단서를 연결해 봐.","우산이 없었고 옷이 젖었으니 비가 왔다고 추론할 수 있어."],
 ["“지호는 시험지를 받자마자 미소를 지었다. 어젯밤 공부한 문제가 그대로 나왔기 때문이다.” 지호의 마음은?","자신 있다",["걱정된다","화가 난다","지루하다"],"미소와 ‘공부한 문제가 나왔다’를 함께 봐.","아는 문제가 나와서 자신감이 생겼어."],
 ["“할머니는 돋보기를 찾으시다가 결국 신문을 내려놓으셨다.” 생략된 내용으로 알맞은 것은?","돋보기를 찾지 못하셨다.",["신문이 재미없었다.","할머니가 주무셨다.","신문을 다 읽으셨다."],"‘결국’이라는 말에 주목해.","돋보기 없이 글씨가 안 보여 신문을 내려놓으셨다고 추론할 수 있어."],
 ["추론할 때 가장 중요한 것은?","글 속의 단서를 근거로 삼는다",["내 마음대로 상상한다","제목만 본다","마지막 문장만 읽는다"],"추론은 아무렇게나 하는 게 아니야.","추론은 글의 단서와 내 배경지식을 연결하는 거야."]],
 w:"오늘 있었던 일을 한 문장으로 쓰고, 그때 내 마음을 추론할 단서를 하나 넣어 봐."},
{c:"6국02-02",a:"읽기",t:"함축된 표현 읽기",cards:[["🎁","<b>함축된 표현</b>은 말 속에 다른 뜻을 담고 있는 표현이에요."],["☁️","“엄마 얼굴에 먹구름이 끼었다.” → 진짜 구름이 아니라 <b>기분이 좋지 않다</b>는 뜻!"],["🔦","문맥(앞뒤 내용)을 살피면 숨은 뜻이 보여요."]],
 qs:[["“엄마 얼굴에 먹구름이 끼었다.”의 뜻은?","엄마의 기분이 좋지 않다",["엄마가 밖에 계셨다","날씨가 흐렸다","엄마가 화장을 했다"],"얼굴에 진짜 구름이 낄 수 있을까?","먹구름은 어둡고 무거운 기분을 빗댄 거야."],
 ["“발표가 끝나자 교실이 쥐 죽은 듯 조용해졌다.”의 뜻은?","교실이 매우 조용했다",["교실에 쥐가 있었다","친구들이 잠들었다","교실이 시끄러웠다"],"쥐가 정말 나온 걸까?","‘쥐 죽은 듯’은 아주 조용한 모습을 나타내."],
 ["“친구의 사과 한마디에 꽁꽁 얼었던 마음이 녹았다.”의 뜻은?","서운했던 마음이 풀렸다",["몸이 따뜻해졌다","얼음을 먹었다","날씨가 풀렸다"],"얼었던 마음 = 어떤 마음?","‘얼었던 마음이 녹았다’는 서운함이 풀렸다는 뜻."],
 ["함축된 표현의 뜻을 알아내는 가장 좋은 방법은?","앞뒤 문맥을 살핀다",["낱말 하나만 사전에서 찾는다","소리 내어 빨리 읽는다","그림만 본다"],"‘먹구름’도 앞뒤 상황을 보고 알았지?","문맥을 보면 표현에 담긴 뜻을 알 수 있어."]],

{c:"6국02-03",a:"읽기",t:"근거가 타당한지 따지기",cards:[["⚖️","좋은 주장은 <b>타당한 근거</b>가 받쳐 줘요."],["✅","타당한 근거: 주장과 관련 있고, 사실이거나 믿을 만한 자료"],["❌","약한 근거: “내 친구도 그랬어.”, “그냥 좋아서.”, 주장과 관계없는 이야기"]],
 qs:[["주장: “학교 도서관을 점심시간에도 열어야 한다.” <b>타당한</b> 근거는?","점심시간에 책을 읽고 싶어 하는 학생이 많다는 조사가 있다.",["내 친구가 그러자고 했다.","도서관 건물이 예쁘다.","책은 종이로 만든다."],"주장과 관련 있고 믿을 만한 것을 골라.","조사 결과는 주장과 관련 있고 믿을 만한 근거야."],
 ["주장: “운동을 꾸준히 하자.” <b>타당하지 않은</b> 근거는?","운동복이 멋있기 때문이다.",["몸이 튼튼해진다.","스트레스가 풀린다.","잠을 잘 자게 된다."],"운동의 좋은 점과 관계없는 것을 찾아봐.","운동복이 멋있다는 건 운동을 해야 하는 까닭으로 약해."],
 ["“모든 학생이 이 게임을 좋아한다. 우리 반 친구 두 명이 좋아하기 때문이다.” 이 근거의 문제는?","두 명만으로 모두를 말할 수 없다",["게임은 원래 재미없다","친구 이름이 없다","문장이 너무 짧다"],"‘모든’과 ‘두 명’을 비교해 봐.","적은 예로 전체를 판단하면 타당하지 않아."],
 ["근거를 평가할 때 던질 질문으로 알맞은 것은?","이 근거는 주장과 관련이 있을까?",["이 글은 몇 쪽일까?","글쓴이는 몇 살일까?","글씨체가 예쁠까?"],"근거가 주장을 정말 받쳐 주는지 보는 질문이야.","관련성과 믿을 만한지를 따져 봐야 해."]],
 w:"“숙제는 ~해야 한다.”는 주장에 타당한 근거 하나를 써 봐."},
{c:"6국01-01",a:"듣기·말하기",t:"대화 속 숨은 뜻",cards:[["💬","대화에서는 모든 말을 다 하지 않아요. 생략된 내용을 <b>추론하며 들어야</b> 해요."],["🎬","A: “오늘 같이 영화 볼래?” B: “내일 시험이야.”<br>→ B는 <b>영화를 못 본다</b>는 뜻이에요."],["👂","말한 사람의 상황과 표정, 말투도 단서가 돼요."]],
 qs:[["A: “오늘 공원 갈래?” B: “나 다리를 다쳤어.” B의 뜻은?","공원에 가기 어렵다",["공원에 가고 싶다","다리가 튼튼하다","병원이 공원에 있다"],"다리를 다쳤다는 말이 대답이 되는 까닭은?","다쳐서 못 간다는 뜻을 돌려 말한 거야."],
 ["엄마: “지금 몇 시니?” (밤 11시, 아직 게임 중인 나) 엄마의 뜻은?","이제 그만하고 자라",["시계가 고장 났다","시간을 몰라서 물어본다","게임을 더 해도 된다"],"밤 11시라는 상황을 생각해 봐.","시간을 묻는 말로 자야 할 시간이라는 걸 알려 주신 거야."],
 ["A: “이 케이크 맛있다!” B: “그거 내가 만든 거야.” B의 마음은?","뿌듯하다",["속상하다","무섭다","미안하다"],"내가 만든 걸 칭찬받으면?","칭찬을 듣고 뿌듯해서 덧붙인 말이야."],
 ["대화에서 생략된 내용을 추론하며 들으면 좋은 점은?","상대의 진짜 뜻을 알 수 있다",["말을 빨리 할 수 있다","대화가 짧아진다","대답을 안 해도 된다"],"앞의 예들을 떠올려 봐.","숨은 뜻을 알면 오해 없이 대화할 수 있어."]],

{c:"6국01-02",a:"듣기·말하기",t:"연설을 들으며 판단하기",cards:[["🎤","연설이나 발표를 들을 때는 <b>주장</b>이 무엇인지 먼저 잡아요."],["🤔","그다음 <b>이유와 근거가 타당한지</b> 생각하며 들어요."],["🗒️","듣는 중에 메모하면 판단하기 쉬워요."]],
 qs:[["회장 후보 연설: “제가 회장이 되면 쉬는 시간을 1시간으로 늘리겠습니다.” 이 공약의 문제는?","학생 회장이 정할 수 없는 일이다",["쉬는 시간은 좋은 것이다","문장이 짧다","목소리가 작다"],"회장이 실제로 할 수 있는 일인지 생각해 봐.","실천할 수 없는 공약은 타당하지 않아."],
 ["“교실 화분에 물 주기 당번을 정하겠습니다. 지난달 화분 세 개가 말랐기 때문입니다.” 이 근거는?","주장과 관련 있고 실제 일이라 타당하다",["주장과 관계없다","믿을 수 없는 소문이다","너무 어렵다"],"근거가 실제로 일어난 일인지, 주장과 맞는지 봐.","실제 문제를 근거로 들어서 타당해."],
 ["연설을 들을 때 가장 알맞은 태도는?","주장과 근거를 따져 보며 듣는다",["인기 많은 친구 말만 믿는다","끝까지 듣지 않는다","목소리 큰 사람을 고른다"],"좋은 판단을 하려면?","주장과 근거의 타당성을 따지며 들어야 해."],
 ["근거가 <b>타당하지 않은</b> 연설은?","“저는 키가 크니까 회장이 되어야 합니다.”",["“작년 부회장으로 행사를 맡아 해 봤습니다.”","“건의함을 만들어 매주 확인하겠습니다.”","“친구들의 의견을 조사해 왔습니다.”"],"회장 일과 관련 있는 근거인지 봐.","키는 회장 역할과 관련이 없어."]],
 w:"내가 회장 후보라면 할 수 있는 공약 하나와 그 근거를 써 봐."},
{c:"6국05-02",a:"문학",t:"비유하는 표현",cards:[["🪞","<b>비유</b>는 어떤 것을 다른 것에 빗대어 표현하는 방법이에요."],["🍎","<b>직유</b>: ‘~처럼, ~같이, ~듯’을 써서 빗대요. “사과 같은 내 얼굴”"],["🌙","<b>은유</b>: “A는 B다”로 바로 빗대요. “내 마음은 호수요”"]],
 qs:[["“동생 볼이 사과처럼 빨갛다.”에 쓰인 비유는?","직유",["은유","의인","과장"],"‘~처럼’이 보이지?","‘처럼’을 써서 빗대었으니 직유."],
 ["“우리 엄마는 나의 햇살이다.”에 쓰인 비유는?","은유",["직유","반복","대조"],"‘~처럼’ 없이 ‘A는 B다’ 꼴이야.","‘A는 B다’로 바로 빗대었으니 은유."],
 ["“눈이 솜사탕같이 내린다.”에서 눈을 솜사탕에 빗댄 까닭은?","부드럽고 포근한 느낌을 주려고",["눈이 달콤해서","눈이 분홍색이어서","눈이 빨리 녹아서"],"솜사탕을 떠올리면 어떤 느낌이야?","솜사탕의 부드러운 느낌을 눈에 옮긴 거야."],
 ["비유하는 표현을 쓰면 좋은 점은?","대상을 생생하고 새롭게 느끼게 한다",["글이 항상 짧아진다","뜻을 숨길 수 있다","맞춤법이 쉬워진다"],"‘사과 같은 볼’을 들으면 바로 그려지지?","비유는 대상을 생생하게 떠올리게 해."]],
 w:"우리 집 고양이(또는 좋아하는 것)를 직유나 은유로 한 문장 써 봐."},
{c:"6국05-03",a:"문학",t:"인물·사건·배경",cards:[["🎭","이야기의 세 요소: <b>인물</b>(누가) · <b>사건</b>(무슨 일이) · <b>배경</b>(언제, 어디서)"],["📖","<i>비 오는 밤, 하윤이는 골목에서 떨고 있는 아기 고양이를 발견했다. 하윤이는 망설이다가 우산을 고양이 쪽으로 기울여 주었다. 다음 날 아침, 하윤이는 엄마와 함께 고양이를 동물병원에 데려갔다.</i>"],["🔗","배경은 사건의 분위기를 만들고, 사건은 인물의 성격을 보여 줘요."]],
 qs:[["이야기의 <b>배경</b>은?","비 오는 밤의 골목",["동물병원 진료실","하윤이의 학교","눈 오는 아침"],"사건이 처음 일어난 때와 장소를 찾아봐.","‘비 오는 밤, 골목’이 처음 사건의 배경이야."],
 ["이야기의 중심 <b>사건</b>은?","하윤이가 떨고 있는 아기 고양이를 돕는다",["하윤이가 우산을 잃어버린다","엄마가 병원에 간다","고양이가 집을 찾아간다"],"무슨 일이 일어났고, 하윤이는 어떻게 했지?","고양이를 발견하고 도와준 것이 중심 사건이야."],
 ["하윤이의 성격으로 알맞은 것은?","약한 존재를 돌볼 줄 안다",["겁이 많아 아무것도 안 한다","고양이를 싫어한다","비를 좋아한다"],"‘망설이다가 우산을 기울여 주었다’를 봐.","망설였지만 결국 도운 행동에서 따뜻한 성격이 보여."],
 ["‘비 오는 밤’이라는 배경이 하는 일은?","고양이의 어려운 처지를 더 크게 느끼게 한다",["이야기를 짧게 만든다","하윤이의 나이를 알려 준다","사건과 관계없다"],"맑은 낮이었다면 느낌이 어땠을까?","춥고 어두운 배경이 고양이의 처지를 더 안타깝게 만들어."]],
 w:"이야기 뒤에 이어질 사건을 한두 문장으로 상상해 써 봐."},
{c:"6국05-01",a:"문학",t:"작가의 의도",cards:[["✍️","작가는 이야기로 <b>전하고 싶은 생각</b>이 있어요. 이것을 작가의 의도라고 해요."],["🔍","찾는 요령: 인물이 무엇을 깨달았는지, 이야기 끝이 어떻게 바뀌었는지 보세요."],["📚","같은 이야기라도 읽는 사람마다 조금씩 다르게 느낄 수 있어요. 단, 글 속 근거가 있어야 해요."]],
 qs:[["<i>토끼는 거북을 얕보고 낮잠을 자다 경주에서 졌다.</i> 작가의 의도로 알맞은 것은?","자만하지 말고 꾸준히 노력하자",["토끼는 잠이 많다","거북은 빠르다","경주는 위험하다"],"토끼가 진 까닭을 생각해 봐.","얕보고 게으름 피운 토끼가 졌으니 ‘꾸준함’을 말하고 싶은 거야."],
 ["하윤이와 아기 고양이 이야기(앞 과)의 의도로 알맞은 것은?","작은 생명을 아끼는 마음의 소중함",["비 오는 날에는 집에 있자","동물병원은 무섭다","우산은 꼭 챙기자"],"하윤이의 행동이 무엇을 보여 줬지?","약한 생명을 돌보는 마음을 전하고 싶은 거야."],
 ["작가의 의도를 찾을 때 가장 좋은 단서는?","인물의 변화와 이야기의 끝",["책의 쪽수","등장인물의 이름 길이","글자 크기"],"인물이 무엇을 깨달았는지 보라고 했지?","인물의 변화와 결말에 의도가 담겨 있어."],
 ["작가의 의도를 말할 때 바른 태도는?","글 속 근거를 들어 내 생각을 말한다",["근거 없이 느낌만 말한다","작가의 나이를 맞힌다","친구 답을 그대로 따라 한다"],"생각은 달라도 되지만 꼭 필요한 것은?","의견은 달라도 글 속 근거가 있어야 해."]],
 w:"최근 읽은 책 한 권의 작가 의도를 한 문장으로 써 봐."},
{c:"6국06-02",a:"매체",t:"믿을 만한 뉴스 고르기",cards:[["📰","뉴스나 인터넷 글이 모두 믿을 만한 건 아니에요."],["🔎","확인할 것: <b>누가</b> 썼나(출처) · <b>언제</b> 썼나(날짜) · <b>사실</b>인가 <b>의견</b>인가 · 다른 곳에서도 같은 내용이 확인되나"],["⚠️","“충격! 무조건 공유하세요!” 같은 말은 의심부터!"]],
 qs:[["다음 중 <b>사실</b>인 문장은?","서울의 오늘 최고 기온은 15도였다.",["오늘 날씨가 최고로 좋았다.","가을이 가장 아름다운 계절이다.","이 영화는 누구나 좋아할 것이다."],"확인할 수 있는 내용인지 생각해 봐.","기온은 재서 확인할 수 있는 사실이야. 나머지는 의견."],

const KWT=KW.map(x=>x[0]).sort((a,b)=>b.length-a.length);
const KWI=Object.fromEntries(KW.map((x,i)=>[x[0],i]));
const KW_DAYS=[0,1,3,7,14];
function kwInit(){S.kw=S.kw||{w:{},log:[]};return S.kw}
function kwSt(t){const k=kwInit();return k.w[t]||(k.w[t]={b:0,next:"",ok:0,days:[],taps:0,unk:false})}
function addDays(d,n){const[y,m,dd]=d.split("-").map(Number),x=new Date(y,m-1,dd+n);return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate())}
function kwMastered(t){const s=(kwInit().w[t]);return !!s&&s.days.length>=3&&s.b>=3}
function kwSeen(t){return !!kwInit().w[t]}
function kwDue(){const td=today();return KW.map(x=>x[0]).filter(t=>{const s=kwInit().w[t];return s&&!kwMastered(t)&&(!s.next||s.next<=td)})}
function kwMark(t,ok){const s=kwSt(t),td=today();if(ok){if(!s.days.includes(td)){s.days.push(td);s.b=Math.min(4,s.b+1)}s.ok++}else{s.b=0;s.unk=true}s.next=addDays(td,KW_DAYS[s.b]||1);save()}
function kwCount(){return KW.filter(x=>kwMastered(x[0])).length}
// 글 속 개념어를 눌러 볼 수 있게
function kwLink(html){const used=new Set(["조사"]);return html.split(/(<[^>]+>)/).map(part=>{if(part.startsWith("<"))return part;let out="",i=0;while(i<part.length){let hit=null;for(const t of KWT){if(part.startsWith(t,i)){hit=t;break}}if(hit&&used.has(hit)){out+=hit;i+=hit.length;continue}if(hit){used.add(hit);out+=`<span class="kwd" data-kw="${hit}">${hit}</span>`;i+=hit.length}else{out+=part[i];i++}}return out}).join("")}
function bindKw(root){(root||app).querySelectorAll(".kwd").forEach(x=>x.onclick=e=>{e.stopPropagation();kwPop(x.dataset.kw,true)})}
function kwCardHTML(t){const w=KW[KWI[t]];return `<div class="kwcard"><div class="kwterm">${t}</div>${w[1]?`<div class="kwhan">${w[1]}</div>`:""}<p class="kwmean">${w[2]}</p><p class="kwex">예) ${w[3]}</p></div>`}
function kwPop(t,tap){const s=kwSt(t);if(tap){s.taps++;s.unk=true;if(!kwMastered(t)){s.b=Math.min(s.b,1);s.next=addDays(today(),1)}save()}
  const o=document.createElement("div");o.className="pop-ov";o.innerHTML=`<div class="pop-card">${kwCardHTML(t)}<p class="muted">${kwMastered(t)?"⭐ 마스터한 개념어!":"내일 복습에 다시 나와요."}</p><button class="big" type="button">알겠어!</button></div>`;document.body.appendChild(o);o.querySelector("button").onclick=()=>o.remove()}
function kwOpts(t){const others=shuffle(KW.filter(x=>x[0]!==t)).slice(0,3);return others}
function kwQs(list){return list.map(t=>{const w=KW[KWI[t]],o=kwOpts(t);return Math.random()<.5?mkQ(`이 뜻을 가진 개념어는?<br><span class="kwq">${w[2]}</span>`,t,o.map(x=>x[0]),`${t}${w[1]?` — ${w[1]}`:""}: ${w[2]}`,{kw:t,hint:w[1]?`한자 힌트: ${w[1]}`:`예) ${w[3]}`})
    :mkQ(`<b>‘${t}’</b>의 뜻은?${w[1]?`<br><small class="muted">${w[1]}</small>`:""}`,w[2],o.map(x=>x[2]),`예) ${w[3]}`,{kw:t,hint:"한자 하나하나의 뜻을 이어서 생각해 봐."})})}
// 진단: 모르는 개념어 찾기
function kwDiag(){const pool=KW.map(x=>x[0]).filter(t=>!kwSeen(t)).slice(0,8);if(!pool.length)return kwDict();let i=0;
  const step=()=>{if(i>=pool.length)return kwDiagEnd(pool);const t=pool[i];
    app.innerHTML=hdr("🔍 개념어 진단")+`<div class="card"><div class="row"><span class="pill">${i+1}/${pool.length}</span><span class="pill">${KW[KWI[t]][4]==="중1"?"중학교 미리 보기":KW[KWI[t]][4]+"학년"}</span></div>
     <div class="kwterm big1">${t}</div><p class="prompt">이 낱말의 뜻을 알아?</p>
     <div class="btns"><button class="big" data-r="2" type="button">알아! 확인해 볼래</button><button class="big alt" data-r="1" type="button">들어는 봤어</button><button class="big alt" data-r="0" type="button">처음 봐</button></div></div>`;bindBack();
    app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const r=+b.dataset.r;if(r===2)return check(t);kwMark(t,false);teach(t)})};
  const teach=t=>{app.innerHTML=hdr("🔍 개념어 진단")+`<div class="card">${kwCardHTML(t)}<p class="muted">괜찮아! 지금 알았으니 내일 다시 만나자.</p><button class="big" id="nx" type="button">다음</button></div>`;bindBack();$("#nx").onclick=()=>{i++;step()}};
  const check=t=>{const q=kwQs([t])[0];app.innerHTML=hdr("🔍 확인 문제")+`<div class="card"><p class="prompt">${q.prompt}</p><div class="tiles2">${q.opts.map((x,j)=>`<button class="opt" type="button" data-j="${j}" style="font-size:.95rem">${x}</button>`).join("")}</div><p class="prompt" id="fb"></p></div>`;bindBack();
    app.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{const ok=+b.dataset.j===q.ans;kwMark(t,ok);if(ok){$("#fb").textContent="정확해! ✨";setTimeout(()=>{i++;step()},900)}else teach(t)})};
  step()}
function kwDiagEnd(pool){const unk=pool.filter(t=>kwInit().w[t].unk);app.innerHTML=hdr("🔍 개념어 진단")+`<div class="card result"><div class="stars">🔍✨</div><h2>진단 끝!</h2><p>${pool.length}개 중 ${pool.length-unk.length}개를 알고 있었어.</p>${unk.length?`<p class="muted">새로 알게 된 말: ${unk.join(", ")}<br>이 말들은 며칠 간격으로 다시 나와서 꼭 내 것으로 만들어 줄게!</p>`:""}<div class="btns" style="width:100%"><button class="big" id="more" type="button">더 진단하기</button><button class="big alt" id="gohome" type="button">국어로</button></div></div>`;bindBack();$("#more").onclick=kwDiag;$("#gohome").onclick=ko}
function kwReview(next){const due=kwDue().slice(0,4);if(!due.length)return next?next():kwDict();
  quiz({title:"개념어 복습",qs:kwQs(due),onAnswer:(q,ok)=>kwMark(q.kw,ok),after:next||null})}
function kwDict(){kwInit();const groups=[["3-4","국어 3~4학년"],["5-6","국어 5~6학년"],["중1","국어 중학교 미리 보기"],["수학","수학 6학년"]];
  app.innerHTML=hdr("📗 개념어 사전")+`<div class="card"><h3>⭐ 개념어 마스터 ${kwCount()} / ${KW.length}</h3><div class="bar"><i style="width:${kwCount()/KW.length*100}%;background:#7C6CF0"></i></div><p class="muted">세 번, 서로 다른 날에 맞히면 ‘마스터’! 낱말을 누르면 뜻이 나와요.</p>
   <div class="btns2"><button class="big" id="kwr" type="button">복습 ${kwDue().length}개</button><button class="big alt" id="kwd" type="button">🔍 진단</button></div></div>`+
   groups.map(([g,n])=>`<div class="card"><h3>${n}</h3><div class="tapchips">${KW.filter(x=>x[4]===g).map(x=>{const t=x[0],s=kwInit().w[t];return `<button type="button" class="tc kwchip ${kwMastered(t)?"on":""}" data-t="${t}">${kwMastered(t)?"⭐":s?(s.unk?"🔸":"·"):"○"} ${t}</button>`}).join("")}</div></div>`).join("")+
   `<p class="muted" style="text-align:center">⭐ 마스터 · 🔸 몰랐던 말(복습 중) · ○ 아직 안 만남</p>`;

{u:"3. 공간과 입체",t:"위·앞·옆에서 본 모양",c:[["🧊","쌓기나무로 만든 모양은 보는 방향에 따라 다르게 보여요. 위, 앞, 옆에서 본 모양을 각각 그려 볼 수 있어요."],["👀","앞에서 보면 각 줄에서 <b>가장 높은 층</b>만큼 보여요."],["🗺️","위에서 본 모양에 각 칸에 쌓인 개수를 숫자로 쓰면, 똑같이 다시 쌓을 수 있어요."]],
 g:()=>{const qs=[];for(let k=0;k<3;k++){const g=[[RI(1,3),RI(0,2)],[RI(1,3),RI(1,3)]];const tot=g.flat().reduce((a,b)=>a+b,0);const grid=`<table class="mgrid">${g.map(r=>`<tr>${r.map(v=>`<td>${v||""}</td>`).join("")}</tr>`).join("")}</table>`;qs.push([`위에서 본 모양에 쌓은 개수를 썼어요. 쌓기나무는 모두 몇 개?${grid}`,`${tot}개`,uniq(`${tot}개`,[`${tot+1}개`,`${tot-1}개`,`${g.flat().filter(x=>x).length}개`]),"칸에 쓰인 숫자를 모두 더해 봐.",`${g.flat().filter(x=>x).join(" + ")} = ${tot}`])}
  qs.push(["앞에서 본 모양을 알려면 각 줄에서 무엇을 보면 될까?","가장 높이 쌓인 층수",["가장 낮은 층수","전체 개수","칸의 개수"],"앞에서 보면 뒤에 숨은 낮은 탑은 안 보여.","앞에서는 각 줄의 가장 높은 층까지 보여."]);return qs},
 w:"위에서 본 모양에 숫자를 쓰면 좋은 점을 설명해 봐.",ex:"숫자를 쓰면 보이지 않는 곳의 쌓기나무도 알 수 있어서 똑같이 쌓을 수 있다."},
{u:"3. 공간과 입체",t:"층별로 나누어 세기",c:[["🏢","쌓기나무를 <b>1층, 2층, 3층</b>으로 나누어 세면 빠뜨리지 않아요."],["🔢","1층 개수 = 위에서 본 칸의 수<br>2층 개수 = 2 이상이 쓰인 칸의 수"],["✅","층별 개수를 모두 더하면 전체 개수!"]],
 g:()=>{const qs=[];for(let k=0;k<3;k++){const g=[RI(1,3),RI(1,3),RI(1,3),RI(1,2)];const L1=g.length,L2=g.filter(x=>x>=2).length,L3=g.filter(x=>x>=3).length;const grid=`<table class="mgrid"><tr><td>${g[0]}</td><td>${g[1]}</td></tr><tr><td>${g[2]}</td><td>${g[3]}</td></tr></table>`;const pick=RI(0,1);
   if(pick)qs.push([`위에서 본 모양의 숫자를 보고, <b>2층</b>에 있는 쌓기나무는 몇 개?${grid}`,`${L2}개`,uniq(`${L2}개`,[`${L1}개`,`${L3}개`,`${L2+1}개`]),"2 이상이 쓰인 칸을 세어 봐.",`2 이상인 칸: ${L2}개`]);
   else qs.push([`<b>1층</b>에 있는 쌓기나무는 몇 개?${grid}`,`${L1}개`,uniq(`${L1}개`,[`${L2}개`,`${L1+L2+L3}개`,`${L1+1}개`]),"1층은 모든 칸에 하나씩 있어.",`칸이 ${L1}개니까 1층은 ${L1}개`])}
  qs.push(["1층 4개, 2층 2개, 3층 1개면 모두 몇 개?","7개",["6개","8개","4개"],"층별 개수를 더해.","4 + 2 + 1 = 7"]);return qs},
 w:"층별로 나누어 세는 방법을 동생에게 알려 주듯 설명해 봐.",ex:"먼저 1층을 다 세고, 그다음 2층, 3층을 세어 더하면 빠뜨리지 않는다."},
{u:"4. 비례식과 비례배분",t:"비의 성질",c:[["⚖️","비 3 : 5에서 앞에 있는 3을 <b>전항</b>, 뒤에 있는 5를 <b>후항</b>이라고 해요."],["✖️","전항과 후항에 <b>0이 아닌 같은 수</b>를 곱하거나 나누어도 비율은 같아요.<br>3 : 5 = 6 : 10 = 9 : 15"],["➗","간단한 자연수의 비로 나타내기: 12 : 18 → 둘 다 6으로 나누면 2 : 3"]],
 g:()=>{const qs=[];for(let k=0;k<2;k++){const a=RI(1,5),b=RI(a+1,9),g=gcd(a,b);const A=a/g,B=b/g,m=RI(2,6);const ans=`${A} : ${B}`;qs.push([`가장 간단한 자연수의 비로 나타내면? <b class="big2">${A*m} : ${B*m}</b>`,ans,uniq(ans,[`${B} : ${A}`,`${A*m} : ${B}`,`${A+1} : ${B+1}`]),"두 수를 똑같은 수로 나누어 봐.",`둘 다 ${m}로 나누면 ${ans}`])}
  const a=RI(2,5),b=RI(a+1,9),m=RI(2,5);qs.push([`${a} : ${b}의 비율과 같은 비는?`,`${a*m} : ${b*m}`,uniq(`${a*m} : ${b*m}`,[`${a*m} : ${b+m}`,`${a+m} : ${b+m}`,`${b*m} : ${a*m}`,`${a+1} : ${b*m}`]),"전항과 후항에 같은 수를 곱한 것을 찾아.",`둘 다 ${m}배 했어.`]);
  qs.push(["비 7 : 4에서 <b>전항</b>은?","7",["4","11","3"],"‘전’은 앞이라는 뜻이야.","앞에 있는 7이 전항, 뒤의 4가 후항."]);return qs},
 w:"비의 성질을 이용해 비를 간단하게 만드는 방법을 설명해 봐.",ex:"전항과 후항을 같은 수로 나누면 비율은 그대로이고 비는 간단해진다."},
{u:"4. 비례식과 비례배분",t:"비례식",c:[["🟰","비율이 같은 두 비를 = 로 나타낸 식을 <b>비례식</b>이라고 해요. 2 : 3 = 4 : 6"],["🔗","바깥쪽 두 수(2와 6)는 <b>외항</b>, 안쪽 두 수(3과 4)는 <b>내항</b>."],["✨","비례식에서 <b>외항의 곱 = 내항의 곱</b>! 2×6 = 3×4 = 12"]],
 g:()=>{const qs=[];for(let k=0;k<3;k++){const a=RI(2,6),b=RI(2,9),m=RI(2,5);const ans=String(b*m);qs.push([`비례식 ${a} : ${b} = ${a*m} : □ 에서 □는?`,ans,uniq(ans,[b+m,a*m,b*m+1,b*(m+1)]),"외항의 곱과 내항의 곱이 같아. 또는 몇 배 했는지 봐.",`${a}를 ${m}배 해서 ${a*m}이니까 ${b}도 ${m}배 → ${ans}`])}
  qs.push(["비례식 2 : 3 = 4 : 6에서 <b>외항</b>은?","2와 6",["3과 4","2와 3","4와 6"],"바깥쪽에 있는 두 수야.","바깥쪽 2와 6이 외항."]);return qs},
 w:"외항의 곱과 내항의 곱이 같다는 것을 예를 들어 설명해 봐.",ex:"2 : 3 = 4 : 6에서 외항 2×6 = 12, 내항 3×4 = 12로 같다."},
{u:"4. 비례식과 비례배분",t:"비례배분",c:[["🍬","전체를 주어진 비로 나누는 것을 <b>비례배분</b>이라고 해요."],["✏️","사탕 20개를 나와 동생이 3 : 2로 나누면<br>나: 20 × 3/(3+2) = 12개, 동생: 20 × 2/(3+2) = 8개"],["✅","두 몫을 더하면 꼭 전체가 돼야 해요. 12 + 8 = 20!"]],
 g:()=>{const qs=[];for(let k=0;k<3;k++){const a=RI(1,4),b=RI(1,4),m=RI(2,6);const T=(a+b)*m,ans=`${a*m}개`;qs.push([`구슬 ${T}개를 Victoria와 동생이 ${a} : ${b}로 나누면 Victoria는 몇 개?`,ans,uniq(ans,[`${b*m}개`,`${a}개`,`${T-a}개`,`${a*m+1}개`]),`전체를 ${a+b}묶음으로 나누면 한 묶음은 몇 개일까?`,`${T} ÷ ${a+b} = ${m}, ${m} × ${a} = ${a*m}`])}
  qs.push(["비례배분한 두 몫을 더하면?","처음 전체의 양",["항상 10","두 비의 합","0"],"나누기 전 전체를 떠올려 봐.","나눈 것을 다시 모으면 전체가 돼."]);return qs},
 w:"용돈을 비례배분하는 상황을 하나 만들어 풀이를 설명해 봐.",ex:"용돈 10000원을 저금과 간식에 3 : 2로 나누면 저금은 6000원, 간식은 4000원이다."},
{u:"5. 원의 둘레와 넓이",t:"원주와 원주율",c:[["⭕","원의 둘레를 <b>원주</b>라고 해요."],["📏","어떤 원이든 원주는 지름의 약 3.14배예요. 이 값을 <b>원주율</b>이라고 해요.<br>원주율 = 원주 ÷ 지름"],["🔢","원주율은 3.1415926…처럼 끝없이 이어지는 수라서, 보통 3.14로 계산해요. (문제에 3이나 3.1을 쓰라고 하면 그 수로!)"]],
 g:()=>{const qs=[];for(let k=0;k<3;k++){const d=RI(2,10);const ans=fmt(d*3.14);qs.push([`지름이 ${d} cm인 원의 <b>원주</b>는? (원주율 3.14)`,`${ans} cm`,uniq(`${ans} cm`,[`${fmt(d*3.14/2)} cm`,`${fmt(d*2*3.14)} cm`,`${fmt(d+3.14)} cm`]),"원주 = 지름 × 원주율",`${d} × 3.14 = ${ans}`])}
  qs.push(["<b>원주율</b>의 뜻으로 알맞은 것은?","원주를 지름으로 나눈 값",["지름을 반지름으로 나눈 값","원의 넓이","원주와 지름을 더한 값"],"원주가 지름의 몇 배인지 나타내는 수야.","원주율 = 원주 ÷ 지름 ≈ 3.14"]);return qs},
 w:"원주율이 무엇인지 내 말로 설명해 봐.",ex:"원주율은 원의 둘레가 지름의 몇 배인지 나타낸 수로, 약 3.14이다."},
{u:"5. 원의 둘레와 넓이",t:"반지름으로 원주 구하기",c:[["↔️","<b>지름 = 반지름 × 2</b>"],["✏️","반지름이 5 cm면 지름은 10 cm, 원주는 10 × 3.14 = 31.4 cm"],["🔁","거꾸로, 원주를 알면 지름 = 원주 ÷ 원주율"]],
 g:()=>{const qs=[];for(let k=0;k<2;k++){const r=RI(2,9);const ans=fmt(r*2*3.14);qs.push([`반지름이 ${r} cm인 원의 원주는? (원주율 3.14)`,`${ans} cm`,uniq(`${ans} cm`,[`${fmt(r*3.14)} cm`,`${fmt(r*r*3.14)} cm`,`${fmt(r*4*3.14)} cm`]),"반지름을 지름으로 바꿔 봐.",`지름 ${r*2} × 3.14 = ${ans}`])}
  const d=RI(2,9);qs.push([`원주가 ${fmt(d*3.14)} cm인 원의 지름은? (원주율 3.14)`,`${d} cm`,uniq(`${d} cm`,[`${d*2} cm`,`${fmt(d/2)} cm`,`${d+1} cm`]),"지름 = 원주 ÷ 원주율",`${fmt(d*3.14)} ÷ 3.14 = ${d}`]);
  qs.push(["지름이 12 cm인 원의 반지름은?","6 cm",["24 cm","12 cm","3 cm"],"지름은 반지름의 2배야.","12 ÷ 2 = 6"]);return qs},
 w:"반지름만 알 때 원주를 구하는 순서를 설명해 봐.",ex:"반지름에 2를 곱해 지름을 구하고, 지름에 3.14를 곱한다."},
{u:"5. 원의 둘레와 넓이",t:"원의 넓이",c:[["🍕","원을 아주 잘게 잘라 엇갈려 붙이면 거의 <b>직사각형</b>이 돼요."],["📐","그 직사각형의 가로는 원주의 반(반지름 × 원주율), 세로는 반지름!"],["✨","그래서 <b>원의 넓이 = 반지름 × 반지름 × 원주율</b>"]],
 g:()=>{const qs=[];for(let k=0;k<3;k++){const r=RI(2,10);const ans=fmt(r*r*3.14);qs.push([`반지름이 ${r} cm인 원의 넓이는? (원주율 3.14)`,`${ans} cm²`,uniq(`${ans} cm²`,[`${fmt(r*2*3.14)} cm²`,`${fmt(r*3.14)} cm²`,`${fmt(r*r*2*3.14)} cm²`]),"반지름 × 반지름 × 원주율",`${r} × ${r} × 3.14 = ${ans}`])}
  qs.push(["원을 잘라 붙여 만든 직사각형의 세로는 원의 무엇과 같을까?","반지름",["지름","원주","원주율"],"원의 중심에서 둘레까지의 길이야.","세로는 반지름, 가로는 원주의 반."]);return qs},
 w:"원의 넓이 공식이 어떻게 나왔는지 설명해 봐.",ex:"원을 잘게 잘라 붙이면 가로가 원주의 반, 세로가 반지름인 직사각형이 되기 때문이다."},
{u:"6. 원기둥, 원뿔, 구",t:"원기둥",c:[["🥫","통조림 캔처럼 위아래가 <b>합동인 원</b>이고 서로 평행한 입체도형을 <b>원기둥</b>이라고 해요."],["🔍","원기둥의 구성 요소: <b>밑면</b> 2개(원), <b>옆면</b> 1개(굽은 면), <b>높이</b>(두 밑면 사이의 거리)"],["🆚","각기둥과 달리 원기둥은 꼭짓점과 모서리가 없어요."]],
 g:()=>[["원기둥의 <b>밑면</b>은 몇 개?","2개",["1개","3개","없다"],"위와 아래를 생각해 봐.","위와 아래에 원 모양 밑면이 2개."],["원기둥의 밑면 모양은?","원",["삼각형","사각형","오각형"],"통조림 캔 뚜껑을 떠올려 봐.","밑면은 합동인 원."],["원기둥에 <b>없는</b> 것은?","꼭짓점",["밑면","옆면","높이"],"뾰족한 곳이 있니?","원기둥은 꼭짓점과 모서리가 없어."],["다음 중 원기둥 모양은?","🥫 통조림 캔",["🎂 고깔모자","⚽ 축구공","🧊 각얼음"],"위아래가 동그랗고 기둥 모양인 것!","통조림 캔이 원기둥 모양이야."]],
 w:"원기둥과 각기둥의 같은 점과 다른 점을 써 봐.",ex:"둘 다 밑면이 2개인 기둥이지만, 원기둥은 밑면이 원이고 꼭짓점이 없다."},
{u:"6. 원기둥, 원뿔, 구",t:"원기둥의 전개도",c:[["📜","원기둥을 펼친 그림을 <b>전개도</b>라고 해요. 밑면 2개(원)와 옆면 1개(직사각형)!"],["↔️","옆면 직사각형의 <b>가로 = 밑면의 둘레</b>(원주)"],["↕️","옆면 직사각형의 <b>세로 = 원기둥의 높이</b>"]],
 g:()=>{const qs=[];const r=RI(2,6),h=RI(3,10);qs.push([`밑면의 반지름이 ${r} cm인 원기둥의 전개도에서 옆면의 <b>가로</b>는? (원주율 3.14)`,`${fmt(r*2*3.14)} cm`,uniq(`${fmt(r*2*3.14)} cm`,[`${fmt(r*3.14)} cm`,`${r*2} cm`,`${h} cm`]),"옆면의 가로는 밑면의 둘레야.",`${r*2} × 3.14 = ${fmt(r*2*3.14)}`]);
  qs.push([`높이가 ${h} cm인 원기둥의 전개도에서 옆면의 <b>세로</b>는?`,`${h} cm`,uniq(`${h} cm`,[`${h*2} cm`,`${r} cm`,`${fmt(h*3.14)} cm`]),"옆면의 세로는 원기둥의 높이와 같아.",`높이 = ${h} cm`]);
  qs.push(["원기둥 전개도에서 옆면의 모양은?","직사각형",["원","삼각형","부채꼴"],"캔의 상표 종이를 펼치면?","옆면을 펼치면 직사각형."]);qs.push(["원기둥 전개도에서 원은 몇 개?","2개",["1개","3개","4개"],"밑면이 몇 개였지?","밑면 2개가 원이야."]);return qs},

function barSVG(n,d,c="#FFC93C",w=240){const h=44,cw=w/d;let s=`<svg class="fbar" viewBox="0 0 ${w+4} ${h+4}" width="${w}" height="${h}">`;for(let i=0;i<d;i++)s+=`<rect x="${2+i*cw}" y="2" width="${cw}" height="${h}" rx="3" fill="${i<n?c:"#FFFFFF"}" stroke="#C99A2E" stroke-width="2"/>`;return s+"</svg>"}
function pieSVG(n,d,c="#FFC93C",R=46){const cx=R+4,cy=R+4;let s=`<svg class="fpie" viewBox="0 0 ${2*R+8} ${2*R+8}" width="${2*R+8}" height="${2*R+8}">`;if(d===1)return s+`<circle cx="${cx}" cy="${cy}" r="${R}" fill="${n?c:"#fff"}" stroke="#C99A2E" stroke-width="2"/></svg>`;
  for(let i=0;i<d;i++){const a0=i/d*2*Math.PI-Math.PI/2,a1=(i+1)/d*2*Math.PI-Math.PI/2,large=1/d>.5?1:0;s+=`<path d="M${cx},${cy} L${cx+R*Math.cos(a0)},${cy+R*Math.sin(a0)} A${R},${R} 0 ${large} 1 ${cx+R*Math.cos(a1)},${cy+R*Math.sin(a1)} Z" fill="${i<n?c:"#FFFFFF"}" stroke="#C99A2E" stroke-width="2"/>`}return s+"</svg>"}
function rulerSVG(mm){const w=260;let s=`<svg class="fbar" viewBox="0 0 ${w} 56" width="${w}" height="56"><rect x="10" y="8" width="${(w-20)}" height="30" fill="#FFF7E0" stroke="#C99A2E"/>`;for(let i=0;i<=10;i++){const x=10+i*(w-20)/10;s+=`<line x1="${x}" y1="8" x2="${x}" y2="${i%5?22:30}" stroke="#7A5A44" stroke-width="${i%5?1:2}"/>`}s+=`<rect x="10" y="40" width="${(w-20)*mm/10}" height="10" rx="3" fill="#FF7AB0"/><text x="10" y="54" font-size="10">0</text><text x="${w-22}" y="54" font-size="10">1cm</text></svg>`;return s}

/* 이해했으면 넘기기 → 랜덤 보석 퀴즈 */
function gemQuiz(q,key,practice,onWin,onLose){const qq=mkQ(q[0],q[1],q[2],q[4],{hint:q[3]});
  app.innerHTML=hdr("💎 보석 퀴즈")+`<div class="card"><div class="gqhead">💎 진짜 이해했다면 풀 수 있는 <b>단 한 문제!</b><br><small>맞히면 보석이 랜덤으로 나와요. 몇 개일지는 몰라요!</small></div>
   <div class="prompt">${plainQ(qq.prompt)}</div><div class="opts">${qq.opts.map((x,k)=>`<button class="opt" type="button" data-k="${k}">${x}</button>`).join("")}</div><div class="cfmbar" id="cfmbar" hidden><button class="big" id="cfmyes" type="button">✅ 이걸로 할게!</button><button class="big alt" id="cfmno" type="button">↩️ 취소</button></div><div id="fb"></div></div>`;bindBack();bindEasy();
  let gsel=null;app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(b.disabled)return;app.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b));gsel=b;$("#cfmbar").hidden=false});
  $("#cfmno").onclick=()=>{gsel=null;app.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));$("#cfmbar").hidden=true};
  $("#cfmyes").onclick=()=>{if(!gsel)return;const b=gsel;b.classList.remove("sel");$("#cfmbar").hidden=true;gsubmit(b)};
  const gsubmit=b=>{app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===qq.ans)x.classList.add("ok")});const ok=+b.dataset.k===qq.ans;if(!ok)b.classList.add("no");
    if(ok){S.gemQ=S.gemQ||{};const td=today(),got=!practice&&S.gemQ[key]!==td;let n=0;if(got){const r=Math.random();n=r<.45?1:r<.8?2:3;S.gems=(S.gems||0)+n;S.gemQ[key]=td;save()}
      $("#fb").innerHTML=`<div class="gembox" id="gbox">🎁</div><p class="prompt" id="gmsg">${got?"보석 상자를 눌러 열어 봐!":practice?"정답! (연습이라 보석은 없어요)":"정답! 이 퀴즈 보석은 오늘 이미 받았어요."}</p><button class="big" id="gnext" type="button">다음으로 ▶</button>`;
      if(got)$("#gbox").onclick=()=>{$("#gbox").textContent="💎".repeat(Math.min(n,5))+(n>5?"✨":"");$("#gbox").classList.add("open");$("#gmsg").innerHTML=`<b>💎 ${n}개!</b> ${n>=5?"대박! ":""}진짜 이해했구나!`;try{confetti()}catch(e){}};
      $("#gnext").onclick=onWin}
    else{$("#fb").innerHTML=`<div class="fb"><div class="ava cat">${chefSvg()}</div><div class="bubble"><b>괜찮아! 아직 조금 헷갈리는구나.</b><p>${plainQ(qq.exp||"")}</p><p>이야기를 끝까지 보고 문제를 차근차근 풀어 보자.</p></div></div><button class="big" id="gnext" type="button">이야기 이어 보기</button>`;bindEasy($("#fb"));$("#gnext").onclick=onLose}}}
function mbLesson(n,practice){const L=MB[n];let i=0;
  const card=()=>{const c=L.c[i];app.innerHTML=hdr("🌱 "+L.t)+`<div class="card"><div class="dots">${L.c.map((_,j)=>`<i class="${j===i?"on":""}"></i>`).join("")}</div><div class="hstory"><span class="hem">${c[0]}</span></div>
     ${c[2]?`<div class="mpic">${c[2]}</div>`:""}
     <div class="fb"><div class="ava" style="background:#16A3A3">셈냥</div><div class="bubble"><p style="font-size:1.12rem;line-height:1.75">${kwLink(c[1])}</p></div></div>
     <div class="nav2"><button class="big alt" id="prev" type="button" ${i===0?"disabled":""}>이전</button><button class="big" id="nx" type="button">${i<L.c.length-1?"다음":"문제 풀기!"}</button></div>
     <button class="skipb" id="skip" type="button">🙋 이미 알아요! 넘기기 → 💎 보석 퀴즈</button></div>`;
    bindBack();bindKw();$("#prev").onclick=()=>{i--;card()};$("#nx").onclick=()=>{if(i<L.c.length-1){i++;card()}else go()};
    $("#skip").onclick=()=>{const qs=L.g(),q=qs[Math.floor(Math.random()*qs.length)];gemQuiz(q,"mb"+n,practice,()=>{maAdv("mb",n,practice);ma()},()=>{card()})}};
  const go=()=>quiz({title:"기초 탐험 · "+L.t,qs:L.g().map((q,j)=>mkQ(q[0],q[1],q[2],q[4],{hint:q[3],id:500+n*10+j})),
    onAnswer:(q,ok)=>{const w=S.ma.wrong;if(!ok&&!w.includes(q.id))w.push(q.id);save()},
    onPass:()=>{maAdv("mb",n,practice)},after:()=>maWrite(n,practice,L),afterLabel:"다음: 말로 설명하기 ✏️"});
  card()}

const RT=(x,y,s=14)=>`<path d="M${x+s},${y} L${x+s},${y-s} L${x},${y-s}" ${ST} stroke-width="2"/>`;
function regPoly(n,r=60,cx=80,cy=75){return [...Array(n)].map((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[+(cx+r*Math.cos(a)).toFixed(1),+(cy+r*Math.sin(a)).toFixed(1)]})}
function angleSVG(deg){const r=70,x0=30,y0=110,a=deg*Math.PI/180;return SV(200,130,`<line x1="${x0}" y1="${y0}" x2="${x0+150}" y2="${y0}" ${ST}/><line x1="${x0}" y1="${y0}" x2="${(x0+r*1.8*Math.cos(a)).toFixed(1)}" y2="${(y0-r*1.8*Math.sin(a)).toFixed(1)}" ${ST}/>`+(deg===90?RT(x0,y0,16):`<path d="M${x0+30},${y0} A30,30 0 0 0 ${(x0+30*Math.cos(a)).toFixed(1)},${(y0-30*Math.sin(a)).toFixed(1)}" stroke="#E0457F" stroke-width="2.5" fill="none"/>`)+DOT(x0,y0))}

{t:"선분·반직선·직선",boss:0,c:[["📏","성 울타리를 치려는데 끈이 세 종류야. 두 점을 딱 이어 <b>양쪽 끝이 있는</b> 끈 = <b>선분</b>.",SV(220,40,`${DOT(30,20)}<line x1="30" y1="20" x2="190" y2="20" ${ST}/>${DOT(190,20)}`)],["➡️","한쪽 점에서 시작해 <b>한쪽으로 끝없이</b> 뻗는 선 = <b>반직선</b>. 손전등 빛처럼!",SV(220,40,`${DOT(30,20)}<line x1="30" y1="20" x2="200" y2="20" ${ST}/><path d="M192,12 L204,20 L192,28" ${ST}/>`)],["↔️","<b>양쪽으로 끝없이</b> 뻗는 선 = <b>직선</b>. 시험에 단골이야: 끝이 2개면 선분, 1개면 반직선, 없으면 직선!",SV(220,40,`<line x1="15" y1="20" x2="205" y2="20" ${ST}/><path d="M23,12 L11,20 L23,28 M197,12 L209,20 L197,28" ${ST}/>`)]],
 g:()=>[["양쪽 끝이 있는 곧은 선은?"+SV(220,40,`${DOT(30,20)}<line x1="30" y1="20" x2="190" y2="20" ${ST}/>${DOT(190,20)}`),"선분",["반직선","직선","곡선"],"끝(점)이 몇 개인지 세어 봐.","끝이 2개 → 선분"],["한쪽으로만 끝없이 뻗는 선은?","반직선",["선분","직선","원"],"손전등 빛을 떠올려 봐.","시작점 1개, 한쪽으로 끝없이 → 반직선"],["양쪽으로 끝없이 뻗는 선은?","직선",["선분","반직선","꺾은선"],"끝이 하나도 없어.","끝이 없으면 직선"],["두 점을 이은 가장 짧은 선은?","선분",["직선","반직선","굽은 선"],"양쪽 끝이 그 두 점이야.","두 점을 곧게 이은 선분이 가장 짧아."]],w:"선분, 반직선, 직선의 차이를 ‘끝’이라는 말을 넣어 설명해 봐.",ex:"선분은 끝이 2개, 반직선은 끝이 1개, 직선은 끝이 없다."},
{t:"각과 직각",boss:0,c:[["📐","성문 모서리를 보면 두 선이 한 점에서 만나 꺾여 있지? 한 점에서 그은 두 반직선이 만드는 도형을 <b>각</b>이라고 해. 만나는 점은 <b>꼭짓점</b>!",angleSVG(50)],["📄","종이를 반으로 접고, 또 반으로 접으면 생기는 반듯한 각! 이게 <b>직각</b>이야. 표시는 작은 네모 ㄴ!",angleSVG(90)],["🧱","성벽이 직각이어야 똑바로 서. 공책 모서리, 문 모서리 전부 직각이야. 오늘부터 직각 사냥꾼!"]],
 g:()=>{const d=[30,60,90,120,150][RI(0,4)];return[[`이 각은 직각일까?${angleSVG(d)}`,d===90?"직각이다":"직각이 아니다",[d===90?"직각이 아니다":"직각이다","알 수 없다","각이 아니다"],"종이를 두 번 접은 모서리와 비교해 봐.",d===90?"반듯한 ㄴ 모양, 직각!":"반듯한 ㄴ 모양이 아니니 직각이 아니야."],["각을 이루는 두 반직선이 만나는 점은?","꼭짓점",["변","중심","면"],"뾰족한 점의 이름!","만나는 점은 꼭짓점."],["직각을 표시하는 기호는?","작은 네모(ㄴ)",["작은 동그라미","별표","세모"],"모서리에 작은 네모를 그려.","직각은 ㄴ 모양 작은 네모로 표시해."],["다음 중 직각이 <b>아닌</b> 것은?","피자 한 조각의 뾰족한 끝",["공책의 모서리","문의 모서리","책상 모서리"],"반듯한 ㄴ 모양인지 확인해.","피자 조각 끝은 직각보다 좁아."]]},w:"우리 집에서 직각을 3개 찾아 써 봐.",ex:"냉장고 문 모서리, 책 모서리, 창문 모서리가 직각이다."},
{t:"🏆 보스: 삼각형·사각형·원",boss:1,c:[["🎯","보스 스테이지! 성의 지붕은 세모, 벽돌은 네모, 창문은 동그라미야. 선분 3개로 둘러싸인 도형 = <b>삼각형</b>, 4개 = <b>사각형</b>.",SV(220,90,POLY([[40,80],[70,20],[100,80]])+POLY([[130,25],[200,25],[200,80],[130,80]],"#E3F7F5"))],["🔍","도형의 곧은 선은 <b>변</b>, 변과 변이 만나는 점은 <b>꼭짓점</b>. 삼각형: 변 3, 꼭짓점 3. 사각형: 변 4, 꼭짓점 4. 공식처럼 외워!"],["⭕","원은 굽은 선 하나로 둘러싸여서 <b>변도 꼭짓점도 없어</b>. 이 차이를 알면 보스는 이미 쓰러졌어!",SV(120,90,`<circle cx="60" cy="45" r="38" fill="#FFF3C2" stroke="#5B4BD6" stroke-width="3"/>`)]],
 g:()=>{const n=RI(3,4);return[[`이 도형의 꼭짓점은 몇 개?${SV(160,150,POLY(regPoly(n)))}`,`${n}개`,uniq(`${n}개`,[`${n+1}개`,`${n-1}개`,"0개"]),"뾰족한 점을 손가락으로 짚으며 세어 봐.",`꼭짓점 ${n}개`],["원의 변은 몇 개?","0개",["1개","2개","4개"],"원에는 곧은 선이 있을까?","원은 굽은 선뿐이라 변이 없어."],["선분 4개로 둘러싸인 도형은?","사각형",["삼각형","원","오각형"],"변이 4개!","변 4개 → 사각형"],["삼각형의 변과 꼭짓점 수를 더하면?","6",["3","5","8"],"변 3 + 꼭짓점 3","3 + 3 = 6"]]},w:"삼각형, 사각형, 원을 변과 꼭짓점 개수로 비교해 봐.",ex:"삼각형은 변과 꼭짓점이 3개, 사각형은 4개, 원은 둘 다 없다."},
{t:"직사각형과 정사각형",boss:0,c:[["🧱","성 벽돌을 보자. 네 각이 모두 직각인 사각형 = <b>직사각형</b>.",SV(220,90,POLY([[30,20],[190,20],[190,75],[30,75]],"#E3F7F5")+RT(30,75))],["⬛","그중에서도 네 변의 길이까지 <b>모두 같은</b> 특별한 친구 = <b>정사각형</b>.",SV(120,100,POLY([[20,15],[100,15],[100,95],[20,95]],"#FFE3EF")+RT(20,95))],["💡","일타 포인트! 정사각형은 직사각형의 조건을 다 갖췄으니 <b>정사각형은 직사각형이다 (O)</b>. 하지만 모든 직사각형이 정사각형은 아니야!"]],
 g:()=>[["네 각이 모두 직각인 사각형은?","직사각형",["삼각형","사다리꼴","원"],"‘직’각이 들어간 이름!","네 각이 직각 → 직사각형"],["네 각이 직각이고 네 변의 길이가 모두 같은 사각형은?","정사각형",["직사각형만","삼각형","마름모만"],"‘정’은 모두 똑같다는 뜻이야.","정사각형!"],["“정사각형은 직사각형이다.” 맞을까?","맞다",["틀리다","가끔 맞다","알 수 없다"],"정사각형도 네 각이 직각이지?","직사각형의 조건(네 직각)을 갖췄으니 맞아."],[`한 변이 ${RI(3,9)} cm인 정사각형의 네 변 길이 합은?`.replace(/(\d+) cm/,(m,a)=>m),"",[],"",""]].map(q=>{if(q[1]!=="")return q;const a=+q[0].match(/\d+/)[0];return[q[0],`${a*4} cm`,uniq(`${a*4} cm`,[`${a*2} cm`,`${a+4} cm`,`${a*a} cm`]),"네 변이 모두 같아!",`${a} × 4 = ${a*4}`]}),w:"정사각형이 직사각형인 까닭을 설명해 봐.",ex:"정사각형도 네 각이 모두 직각이라 직사각형의 조건을 모두 갖추었기 때문이다."},
{t:"원의 중심·반지름·지름",boss:0,c:[["🎡","성 앞마당에 동그란 분수를 만들자. 원의 한가운데 점 = <b>원의 중심</b>.",SV(140,120,`<circle cx="70" cy="60" r="50" fill="#E3F7FF" stroke="#5B4BD6" stroke-width="3"/>${DOT(70,60)}`)],["📏","중심에서 원 위의 한 점까지 = <b>반지름</b>. 중심을 지나 원 위의 두 점을 이은 선분 = <b>지름</b>.",SV(140,120,`<circle cx="70" cy="60" r="50" fill="#E3F7FF" stroke="#5B4BD6" stroke-width="3"/><line x1="20" y1="60" x2="120" y2="60" stroke="#E0457F" stroke-width="3"/><line x1="70" y1="60" x2="105" y2="25" stroke="#16A3A3" stroke-width="3"/>${DOT(70,60)}`)],["✌️","시험 단골! <b>지름 = 반지름 × 2</b>. 한 원에서 반지름은 모두 길이가 같아."]],
 g:()=>{const r=RI(2,9);return[[`반지름이 ${r} cm인 원의 지름은?`,`${r*2} cm`,uniq(`${r*2} cm`,[`${r} cm`,`${r+2} cm`,`${r*4} cm`]),"지름은 반지름의 몇 배?",`${r} × 2 = ${r*2}`],[`지름이 ${r*2+2} cm인 원의 반지름은?`,`${r+1} cm`,uniq(`${r+1} cm`,[`${r*2+2} cm`,`${r*4+4} cm`,`${r} cm`]),"반으로 나눠!",`${r*2+2} ÷ 2 = ${r+1}`],["원의 한가운데 점은?","원의 중심",["꼭짓점","지름","반지름"],"‘가운데’ = 중심","원의 중심!"],["한 원에서 반지름은?","모두 길이가 같다",["모두 다르다","2개뿐이다","지름보다 길다"],"중심에서 둘레까지 어디로 재도…","한 원의 반지름은 모두 같아."]]},w:"반지름과 지름의 관계를 설명해 봐.",ex:"지름은 중심을 지나니까 반지름 두 개를 이은 것과 같아서 반지름의 2배이다."},
{t:"각도: 각의 크기 재기",boss:0,c:[["🧭","각이 얼마나 벌어졌는지 재는 단위가 <b>도(°)</b>야. 직각은 <b>90°</b>!",angleSVG(90)],["🔺","직각보다 작은 각 = <b>예각</b> (뾰족해서 ‘예’리한 각), 직각보다 크고 180°보다 작은 각 = <b>둔각</b> (‘둔’하게 벌어진 각).",angleSVG(40)+angleSVG(130)],["📏","각도기 사용법: 중심을 꼭짓점에, 밑금을 한 변에 맞추고 다른 변이 가리키는 눈금을 읽어. 0에서 시작하는 쪽 눈금!"]],
 g:()=>{const d=[20,35,50,70,100,120,140,160][RI(0,7)];return[[`이 각은 예각, 직각, 둔각 중 무엇일까?${angleSVG(d)}`,d<90?"예각":"둔각",[d<90?"둔각":"예각","직각","평각"],"직각(90°)보다 작은지 큰지 비교해.",`${d}° → ${d<90?"90°보다 작아 예각":"90°보다 커 둔각"}`],["직각은 몇 도?","90°",["45°","100°","180°"],"종이 두 번 접은 모서리!","직각 = 90°"],[`${RI(91,179)}°인 각은?`,"둔각",["예각","직각","알 수 없다"],"90°보다 큰지 봐.","90°보다 크고 180°보다 작으니 둔각"],["각의 크기를 잴 때 쓰는 도구는?","각도기",["자","컴퍼스","저울"],"‘각도’를 재는 ‘기’구!","각도기"]]},w:"예각과 둔각을 구별하는 방법을 써 봐.",ex:"직각 90도와 비교해서 작으면 예각, 크면 둔각이다."},
{t:"🏆 보스: 삼각형 세 각의 합",boss:1,c:[["🍕","보스 등장! 종이 삼각형의 세 모서리를 찢어서 한 점에 모아 붙여 봐. 놀랍게도 일직선이 돼!"],["📏","일직선은 180°. 그래서 <b>삼각형 세 각의 크기의 합은 언제나 180°</b>! 크든 작든, 뾰족하든 넓든 예외 없음!"],["🧩","사각형은 삼각형 2개로 나눌 수 있지? 그래서 <b>사각형 네 각의 합은 360°</b>. 180 × 2!"]],
 g:()=>{const a=RI(30,80),b=RI(30,150-a-10),c=180-a-b;const x=RI(60,120),y=RI(50,110),z=RI(50,100),w4=360-x-y-z;return[[`삼각형의 두 각이 ${a}°, ${b}°일 때 나머지 한 각은?`,`${c}°`,uniq(`${c}°`,[`${360-a-b}°`,`${a+b}°`,`${c+10}°`]),"세 각을 더하면 180°!",`180 − ${a} − ${b} = ${c}`],["삼각형 세 각의 합은?","180°",["90°","360°","270°"],"찢어 붙이면 일직선!","180°"],["사각형 네 각의 합은?","360°",["180°","270°","400°"],"삼각형 2개로 나눠 봐.","180 × 2 = 360"],[`사각형의 세 각이 ${x}°, ${y}°, ${z}°일 때 나머지 한 각은?`,`${w4}°`,uniq(`${w4}°`,[`${180-((x+y+z)%180)}°`,`${w4+10}°`,`${w4-10}°`]),"네 각의 합은 360°",`360 − ${x} − ${y} − ${z} = ${w4}`]]},w:"삼각형 세 각의 합이 180°인 것을 어떻게 확인할 수 있는지 써 봐.",ex:"삼각형의 세 모서리를 잘라 한 점에 모으면 일직선이 되고, 일직선은 180도이다."},
{t:"이등변삼각형·정삼각형",boss:0,c:[["⛺","성 지붕 삼각형을 보자. 두 변의 길이가 같은 삼각형 = <b>이등변삼각형</b>. 길이가 같은 두 변 아래의 두 각도 크기가 같아!",SV(160,120,POLY([[30,110],[80,15],[130,110]],"#FFE3EF"))],["🔺","세 변이 모두 같은 삼각형 = <b>정삼각형</b>. 세 각도 모두 같아서 180 ÷ 3 = <b>60°</b>씩!",SV(160,150,POLY(regPoly(3),"#FFF3C2"))],["💡","정삼각형은 두 변도 당연히 같으니 이등변삼각형이기도 해. 직사각형-정사각형 관계랑 똑같지?"]],
 g:()=>{const a=RI(30,70);return[["정삼각형의 한 각은 몇 도?","60°",["90°","45°","30°"],"세 각이 같고 합은 180°","180 ÷ 3 = 60"],["두 변의 길이가 같은 삼각형은?","이등변삼각형",["직각삼각형","정사각형","둔각삼각형"],"‘이(2)등변’ = 두 변이 같다","이등변삼각형"],[`이등변삼각형의 같은 두 각이 각각 ${a}°이면 나머지 한 각은?`,`${180-2*a}°`,uniq(`${180-2*a}°`,[`${180-a}°`,`${a}°`,`${90-a}°`]),"180에서 두 각을 빼.",`180 − ${a} − ${a} = ${180-2*a}`],["“정삼각형은 이등변삼각형이다.” 맞을까?","맞다",["틀리다","가끔 맞다","알 수 없다"],"정삼각형도 두 변이 같지?","세 변이 같으니 두 변도 같아 → 맞아."]]},w:"정삼각형이 이등변삼각형이기도 한 까닭을 써 봐.",ex:"정삼각형은 세 변이 모두 같으니 두 변이 같다는 조건도 만족한다."},
{t:"수직·평행과 여러 사각형",boss:0,c:[["➕","두 직선이 만나서 직각을 이루면 <b>수직</b>. 아무리 늘여도 서로 만나지 않는 두 직선은 <b>평행</b>. 기찻길처럼!",SV(220,90,`<line x1="20" y1="45" x2="90" y2="45" ${ST}/><line x1="55" y1="10" x2="55" y2="80" ${ST}/>${RT(55,45,12)}<line x1="120" y1="25" x2="210" y2="25" ${ST}/><line x1="120" y1="65" x2="210" y2="65" ${ST}/>`)],["🏛️","평행한 변이 한 쌍이라도 있으면 <b>사다리꼴</b>, 마주 보는 두 쌍의 변이 서로 평행하면 <b>평행사변형</b>, 네 변의 길이가 모두 같으면 <b>마름모</b>.",SV(240,80,POLY([[10,70],[30,15],[70,15],[90,70]])+POLY([[100,70],[125,15],[180,15],[155,70]],"#E3F7F5")+POLY([[205,10],[232,42],[205,74],[178,42]],"#FFF3C2"))],["🧠","일타 정리: 사다리꼴 → 평행 1쌍 이상 / 평행사변형 → 평행 2쌍 / 마름모 → 네 변 같음."]],

sound:[["exp","소리가 나는 소리굽쇠를 물에 살짝 대면 어떻게 될까요?","물이 튄다",["물이 얼어붙는다","아무 변화가 없다","물이 뜨거워진다"],"소리가 나는 물체는 떨리고 있어서 물이 튀어요."],

light:[["exp","손전등과 손 사이의 거리를 가깝게 하면 벽에 생긴 손 그림자는?","커진다",["작아진다","사라진다","색이 바뀐다"],"물체가 빛에 가까울수록 빛을 많이 가려 그림자가 커져요."],

animal:[["exp","배추흰나비 애벌레가 다 자라면 다음에는 무엇이 될까요?","번데기",["알","어른벌레","올챙이"],"배추흰나비는 알 → 애벌레 → 번데기 → 어른벌레로 자라요(완전 탈바꿈)."],

plant:[["exp","같은 화분 두 개 중 하나만 어두운 곳에 일주일 두었어요. 어두운 곳의 식물은 어떻게 될까요?","잎이 누렇게 되고 약하게 자란다",["더 진한 초록색이 된다","꽃이 더 많이 핀다","아무 차이가 없다"],"빛이 없으면 광합성을 하지 못해 잘 자라지 못해요."],

eco:[["exp","어떤 섬에서 뱀이 갑자기 모두 사라진다면, 뱀이 잡아먹던 개구리의 수는 처음에 어떻게 될까요?","늘어난다",["줄어든다","변하지 않는다","모두 사라진다"],"천적이 사라지면 처음에는 수가 늘어나요. 그러다 먹이가 부족해지는 등 생태계 전체가 영향을 받아요."],

 ["why","사막여우의 귀가 크고 북극여우의 귀가 작은 까닭은?","사는 곳의 환경에 적응했기 때문에",["먹이가 달라서","색깔을 맞추려고","그냥 우연이라서"],"큰 귀는 열을 내보내기 좋고, 작은 귀는 열을 덜 잃어요. 환경에 적응한 모습이에요."]],
body:[["exp","팔을 굽힐 때 위팔 안쪽 근육은 어떻게 될까요?","줄어든다",["늘어난다","사라진다","딱딱한 뼈가 된다"],"근육이 줄어들면서 뼈를 당겨 팔이 굽혀져요."],

land:[["exp","흙 언덕을 만들고 위에서 물을 부으면, 위쪽과 아래쪽에서 각각 주로 일어나는 일은?","위쪽은 깎이고(침식), 아래쪽은 쌓인다(퇴적)",["위쪽은 쌓이고 아래쪽은 깎인다","둘 다 쌓인다","아무 변화가 없다"],"흐르는 물은 높은 곳을 깎고, 낮은 곳에 흙을 쌓아요."],

fossil:[["why","보통 지층에서 아래층이 위층보다 먼저 쌓였다고 보는 까닭은?","퇴적물은 아래부터 차례로 쌓이기 때문에",["아래층이 더 무거워서","위층이 더 반짝여서","아래층이 더 얇아서"],"뒤집히지 않았다면 아래층이 먼저, 위층이 나중에 쌓인 거예요."],

weather:[["exp","따뜻한 물을 담은 집기병 위에 얼음 접시를 올리면 병 안에 무엇이 생길까요?","뿌연 김(작은 물방울)",["얼음 덩어리","불꽃","아무것도 생기지 않는다"],"수증기가 차가워져 응결하면 구름처럼 작은 물방울이 생겨요."],
 ["why","맑은 날 낮에 바닷가에서 바다에서 육지 쪽으로 바람이 부는 까닭은?","낮에는 육지가 바다보다 빨리 데워져 기압이 낮아져서",["바다가 더 뜨거워서","파도가 바람을 만들어서","물고기가 헤엄쳐서"],"공기는 고기압(바다)에서 저기압(육지)으로 이동해요. 이것이 해풍이에요."],

solution:[["exp","같은 양의 찬물과 따뜻한 물에 백반을 녹이면, 더 많이 녹는 쪽은?","따뜻한 물",["찬물","똑같다","둘 다 안 녹는다"],"물의 온도가 높을수록 녹는 고체 용질의 양이 대체로 많아요."],
 ["exp","진한 설탕물과 묽은 설탕물에 방울토마토를 넣으면, 더 잘 떠오르는 쪽은?","진한 설탕물",["묽은 설탕물","둘 다 가라앉는다","똑같이 뜬다"],"용액이 진할수록 물체가 더 잘 떠요."],

acid:[["exp","레몬즙에 푸른색 리트머스 종이를 적시면?","붉게 변한다",["푸른색 그대로다","노랗게 변한다","하얗게 변한다"],"레몬즙은 산성이라 푸른색 리트머스 종이를 붉게 바꿔요."],

heat:[["exp","뜨거운 국에 쇠숟가락과 나무 숟가락을 꽂아 두면, 손잡이가 먼저 뜨거워지는 것은?","쇠숟가락",["나무 숟가락","동시에","둘 다 차가워진다"],"금속은 열이 잘 전도돼요."],

fire:[["exp","크기가 다른 집기병으로 같은 촛불을 덮으면, 더 오래 타는 쪽은?","큰 집기병",["작은 집기병","똑같다","둘 다 안 꺼진다"],"큰 집기병 안에 산소가 더 많아서 더 오래 타요."],

speed:[["exp","3시간 동안 150km를 이동한 자동차의 속력은?","50km/h",["150km/h","30km/h","450km/h"],"속력 = 이동 거리 ÷ 걸린 시간 = 150 ÷ 3 = 50(km/h)"],

space:[["why","낮과 밤이 생기는 까닭은?","지구가 하루에 한 바퀴씩 자전해서",["지구가 태양 둘레를 공전해서","달이 태양을 가려서","태양이 지구 둘레를 돌아서"],"지구가 자전하면서 태양을 향한 쪽은 낮, 반대쪽은 밤이 돼요."],

function soInit(){S.so=S.so||{n:0,last:"",cnt:0};S.so.done=S.so.done||{};S.so.best=S.so.best||{};S.so.w=S.so.w||{};return S.so}
function soSt(t){const w=soInit().w;return w[t]||(w[t]={b:0,next:"",ok:0,days:[]})}
function soMark(t,ok){const s=soSt(t),td=today();if(ok){if(!s.days.includes(td)){s.days.push(td);s.b=Math.min(4,s.b+1)}s.ok++}else{s.b=0}s.next=addDays(td,KW_DAYS[s.b]||1);save()}
const soMast=t=>{const s=soInit().w[t];return !!s&&s.days.length>=3&&s.b>=3},soSeen=t=>!!soInit().w[t];
function soDue(){const td=today();return SOALL.filter(x=>{const s=soInit().w[x.t];return s&&!soMast(x.t)&&(!s.next||s.next<=td)}).map(x=>x.t)}
function soCount(){return SOALL.filter(x=>soMast(x.t)).length}
function soOpts(w){const same=SOALL.filter(x=>x.t!==w.t&&x.u===w.u),other=SOALL.filter(x=>x.t!==w.t&&x.u!==w.u);return shuffle(same).concat(shuffle(other)).slice(0,3)}
function soQ(w,i){const o=soOpts(w),tag=`<span class="qtag">${w.em} ${w.ut}</span>`,hint=w.h?`한자 힌트: ${w.h}`:`예) ${w.e}`,k=i%3;
  if(k===0)return mkQ(`${tag}이 뜻을 가진 사회 개념어는?<br><span class="kwq">${w.m}</span>`,w.t,o.map(x=>x.t),`${w.t}${w.h?` — ${w.h}`:""}: ${w.m}`,{so:w.t,hint});
  if(k===1)return mkQ(`${tag}<b>‘${w.t}’</b>의 뜻은?${w.h?`<br><small class="muted">${w.h}</small>`:""}`,w.m,o.map(x=>x.m),`예) ${w.e}`,{so:w.t,hint:"한자 하나하나의 뜻을 이어서 생각해 봐."});
  return mkQ(`${tag}다음 예와 가장 관계있는 개념어는?<br><span class="kwq">${w.e.split(w.t).join("○○")}</span>`,w.t,o.map(x=>x.t),`${w.t}: ${w.m}`,{so:w.t,hint:`뜻: ${w.m.slice(0,18)}…`})}

  soInit();{const nx=SOU.find(U=>!S.so.done[U[0]]);r.push(["🌏 사회",`${Object.keys(S.so.done).length}/${SOU.length} 단원 · ⭐${soCount()}`,nx?`${SOSEM[nx[2]].split(" · ")[0]} ${nx[1]}`:"완료"])}
  r.push(["🔬 과학 개념어",`${Object.keys(skInit().done).length}/${SKU.length} 단원 · ⭐${skCount()}`,""]);
  r.push(["📗 개념어",`${kwCount()}/${KW.length} 마스터`,`익히는 중인 말 ${Object.entries(kwInit().w).filter(([t,v])=>v.unk&&!kwMastered(t)).length}개`]);
  return r}
function weekStats(){const[a,b]=weekRange(),ev=(S.ev||[]).filter(e=>e[0]>=a&&e[0]<=b),cnt={};ev.forEach(e=>cnt[e[1]]=(cnt[e[1]]||0)+1);const days=(S.days||[]).filter(d=>d>=a&&d<=b).length,gemDays=(S.gemDays||[]).filter(d=>d>=a&&d<=b).length;return{a,b,cnt,total:ev.length,days,gemDays}}
const TNAME={hist:"한국사",hz:"한자",en:"영어",ko:"국어",ma:"수학",sci:"과학",so:"사회",mem:"기억 탐험",cook:"요리"};
function weekText(){const w=weekStats(),wr=wrongPool().length,ww=[...(S.ko.writes||[]),...(S.ma.writes||[]),...((S.so&&S.so.writes)||[]),...((S.sk&&S.sk.writes)||[])].filter(x=>x.d>=w.a&&x.d<=w.b),wq=ww.filter(x=>x.qq);
  return `[Victoria 주간 진도표 📊] ${w.a.slice(5).replace("-","/")} ~ ${w.b.slice(5).replace("-","/")}
✅ 이번 주: ${w.days}일 공부 · 퀘스트 ${w.total}개 · 보석 상자 ${w.gemDays}번
${Object.entries(w.cnt).map(([k,v])=>`· ${TNAME[k]||k} ${v}개`).join("\n")||"· (이번 주 기록이 아직 없어요)"}

📚 과목별 진도
${progRows().map(r=>`${r[0]}: ${r[1]} · ${r[2]}`).join("\n")}

💎 보석 ${S.gems||0}개 · ⭐ Lv.${Math.floor(S.xp/50)+1} (${S.xp} XP) · 연속 ${streak()}일
📝 남은 오답 ${wr}개${(S.hardQ||[]).filter(h=>h.d>=w.a).length?` · 🙋 말이 어려웠던 문제 ${(S.hardQ||[]).filter(h=>h.d>=w.a).length}개`:""}
${S.baby?`👶 ${esc(S.baby.name)} ${babyAge()}개월`:""}${ww.length?`\n✏️ 이번 주 내가 쓴 문장\n${ww.slice(-4).map(x=>`· [${x.t}] “${x.a}”`).join("\n")}`:""}${wq.length?`\n❓ 이번 주 내가 만든 질문\n${wq.slice(-4).map(x=>`· ${x.qq}`).join("\n")}`:""}`}
function weekView(){const w=weekStats();app.innerHTML=hdr("📊 주간 진도표")+`<div class="card"><h3>${w.a.slice(5)} ~ ${w.b.slice(5)}</h3><p class="muted">이번 주 ${w.days}일 공부 · 퀘스트 ${w.total}개 · 보석 상자 ${w.gemDays}번</p>
  <table class="ptab"><tr><th>과목</th><th>진도</th><th>다음 / 비고</th></tr>${progRows().map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table>
  <button class="big" id="wsend" type="button">💌 엄마에게 진도표 보내기</button><p class="muted" id="wmsg"></p></div>`;bindBack();
  $("#wsend").onclick=async()=>{const t=weekText();let ok=false;try{if(navigator.share){await navigator.share({title:"Victoria 주간 진도표",text:t});ok=true}}catch(e){if(e&&e.name==="AbortError")return}if(!ok){try{await navigator.clipboard.writeText(t);ok=true;$("#wmsg").textContent="복사했어요! 카톡에 붙여 넣어 보내요."}catch(e){$("#wmsg").textContent=t}}
    if(ok){const[a]=weekRange();if(S.weekSent!==a){S.weekSent=a;addXP(10);S.gems=(S.gems||0)+3;save();toast("📊 진도표 보내기 완료! 💎+3 · +10 XP")}}}}
function weekBanner(){const isSat=new Date().getDay()===6,[a]=weekRange(),sent=S.weekSent===a;if(!isSat&&!sent)return `<button class="card petlink" id="wkgo" type="button"><span class="petem">📊</span><div><h3>주간 진도표</h3><p class="muted">어디까지 왔는지 한눈에! 토요일에 엄마에게 보내면 💎+3</p></div></button>`;
  return `<button class="card petlink ${isSat&&!sent?"wkhot":""}" id="wkgo" type="button"><span class="petem">📊</span><div><h3>${sent?"이번 주 진도표 보냈어요 ✓":"오늘은 토요일! 진도표 보내는 날"}</h3><p class="muted">${sent?"다음 주 토요일에 또 보내요.":"엄마에게 이번 주 진도표를 보내면 💎+3 · +10 XP"}</p></div></button>`}

function rulesHTML(){return `<h2>💎 보석 모으는 법</h2>
<ol class="rules">
<li><b>🗓️ 보석 상자 +10</b><span>홈의 ‘오늘의 코스’ 5칸을 모두 끝내면!</span></li>
<li><b>💎 +1</b><span>코스 밖 퀘스트 1개마다 +1, 만점 퀴즈마다 +1 (각각 하루 3개까지)</span></li>
<li><b>🏠 빅토리아 하우스</b><span>보석으로 아기 맞이 준비, 집 꾸미기, 펫샵(아기 백일 뒤 열림)</span></li>
<li><b>💖 돌봄 하트</b><span>퀘스트 1개 = 하트 1개. 아기와 펫을 돌보는 데 함께 써요</span></li>
<li><b>🐱 고양이 도감</b><span>보석 상자를 연 날마다 고양이 친구가 한 마리씩 (12마리)</span></li>
<li><b>🎉 더블 포인트</b><span>퀴즈를 하나도 안 틀리면 XP가 두 배!</span></li>
<li><b>👑 왕관</b><span>한 주에 보석 5개를 모으면 이번 주 왕관</span></li>
<li><b>🔥 연속 배지</b><span>3일, 7일, 14일, 30일 연속으로 하면 배지</span></li>
<li><b>📝 오답 복습</b><span>틀렸던 문제를 다시 맞히면 한 문제에 💎+1 (하루 최대 5개)</span></li>
<li><b>💌 엄마 쿠폰</b><span>시장에서 보석으로 엄마 쿠폰을 살 수 있어요</span></li>
<li><b>📝 오답 복습 2배</b><span>오답 복습을 한 번도 안 틀리고 모두 맞히면 받은 오답 보석이 2배!</span></li>
<li><b>🗣️ 단원 도장</b><span>과학·사회 단원은 퀴즈 통과 후 ‘내 말로 설명 + 질문 하나’를 써야 도장 (첫 도장 💎+1)</span></li>
</ol>
<p class="muted" style="text-align:left">⏰ 퀘스트는 매일 아침 7시에 열리고, 하루에 퀘스트마다 5개까지 할 수 있어요. 💡 모르면 힌트를 눌러 봐요!</p>`}
function showRules(){const o=document.createElement("div");o.className="pop-ov";o.innerHTML=`<div class="pop-card">${rulesHTML()}<button class="big" type="button">알겠어!</button></div>`;document.body.appendChild(o);o.querySelector("button").onclick=()=>{o.remove();if(!S.rulesSeen){S.rulesSeen=true;save()}}}
function cookStart(){const n=nextCook();S.cookCur=n?n.id:LEVELS.length;save();cook()}
const cOpen=id=>id===1||(S.cook[id-1]&&S.cook[id-1].clear);
function cook(){
  const cur=S.cookCur,l=LEVELS.find(x=>x.id===cur),s=S.cook[cur]||{};
  const preset=[1,3,5,10,15,30].includes(l.timer);
  const safe=l.safe||["🧤 장갑","🥢 집게","⌚ 타이머"].concat(cur===4?["🧼 손 씻기"]:[]);
  const steps=l.steps.concat([l.end||"토스터 끄고, 맛있게 먹기!"]);
  const tIdx=l.timer?steps.findIndex(t=>t.includes("타이머")):-1;
  app.innerHTML=hdr("아침 요리 퀘스트")+`
  <nav class="map" aria-label="레벨 선택">${LEVELS.map(x=>{const st=S.cook[x.id];return `<button class="lv${cOpen(x.id)?"":" locked"}" type="button" data-id="${x.id}" aria-current="${x.id===cur}" ${cOpen(x.id)?"":"disabled"}>${artSvg(x)}<span>Lv.${x.id}</span><span class="st">${st&&st.clear?"★".repeat(st.stars||1):cOpen(x.id)?"":"잠김"}</span></button>`}).join("")}</nav>
  <div class="card">
   <div class="qhead">${artSvg(l)}<div><span class="pill" style="color:var(--accent)">LEVEL ${l.id}${s.cook?` · ${s.cook}번 요리함`:""}</span><h2>${l.name}</h2><p class="muted">${l.sub}</p></div></div>
   <div class="chef"><div class="chefav">${chefSvg()}</div><div class="bubble2" id="cheer">셰프 냥이야! 준비물부터 챙겨 볼까?</div></div>
   <h3>1. 준비물 챙기기</h3><div class="tapchips" id="ing">${l.ing.map((t,i)=>`<button type="button" class="tc" data-i="${i}">${t}</button>`).join("")}</div>
   <h3>2. 안전 장비 착용</h3><div class="tapchips" id="safe">${safe.map((t,i)=>`<button type="button" class="tc" data-i="${i}">${t}</button>`).join("")}</div>
   <h3>3. 요리 시작! <span class="muted" style="font-size:.95rem">순서대로 눌러요</span></h3>
   <div class="gauge"><i id="gauge"></i></div>
   <ol class="csteps" id="steps">${steps.map((t,i)=>`<li><button type="button" class="cs" data-i="${i}" disabled><b>${i+1}</b><span>${t}${i===tIdx?`<small class="wt">⌚ 크라운을 꾹 누르고 "타이머 ${l.timer}분" ${preset?"":"(또는 타이머 앱 최근 항목)"}</small>`:""}</span><em>✓</em></button></li>`).join("")}</ol>
   <button class="big" id="go" type="button" disabled>완성!</button>
   <div id="after" hidden class="result">
     <div class="stamp">VICTORIA<br>CHEF ✓</div>
     <p class="pill" id="msg" style="color:var(--good)"></p>
     <h3>맛은 어땠어?</h3>
     <div class="rate">${[1,2,3].map(n=>`<button type="button" data-n="${n}" aria-label="별 ${n}개">★</button>`).join("")}</div>
     <div id="nextshop" style="width:100%;text-align:left"></div><button class="big" id="nextq" type="button"></button>
   </div>
  </div>`;
  bindBack();
  app.querySelectorAll(".lv").forEach(b=>b.onclick=()=>{S.cookCur=+b.dataset.id;save();cook()});
  const cheer=t=>{$("#cheer").textContent=t};
  const ingB=[...app.querySelectorAll("#ing .tc")],safeB=[...app.querySelectorAll("#safe .tc")],stepB=[...app.querySelectorAll("#steps .cs")];
  let done=0;
  function ready(){return ingB.every(b=>b.classList.contains("on"))&&safeB.every(b=>b.classList.contains("on"))}
  function refresh(){const r=ready();stepB.forEach((b,i)=>b.disabled=!r||i!==done);if(r&&done===0)cheer("준비 완벽해! 1번부터 눌러 봐.");$("#gauge").style.width=(done/steps.length*100)+"%";$("#go").disabled=done<steps.length}
  ingB.forEach(b=>b.onclick=()=>{b.classList.toggle("on");if(ingB.every(x=>x.classList.contains("on"))&&!ready())cheer("준비물 완료! 이제 안전 장비!");refresh()});
  safeB.forEach(b=>b.onclick=()=>{b.classList.toggle("on");refresh()});
  stepB.forEach((b,i)=>b.onclick=()=>{if(i!==done)return;b.classList.add("ok");done++;cheer(done===steps.length?"다 됐다! 완성 버튼 눌러 줘!":i===tIdx?"알람이 울릴 때까지 기다려~ 손목이 떨리면 다음!":CHEER[i%CHEER.length]);refresh()});
  refresh();
  $("#go").onclick=()=>{
    const st=S.cook[cur]=S.cook[cur]||{};st.cook=(st.cook||0)+1;const first=!st.clear;st.clear=true;const td0=today();S.cookDay=S.cookDay&&S.cookDay.d===td0?{d:td0,c:S.cookDay.c+1}:{d:td0,c:1};evLog("cook");addXP(10);checkGem();
    $("#go").hidden=true;$("#after").hidden=false;confetti();cheer(first?`Lv.${cur} 클리어! 너 진짜 셰프다!`:"또 성공! 실력이 늘고 있어!");
    $("#msg").textContent=`+10 XP · ${st.cook}번째 요리${first&&cur<LEVELS.length?` · Lv.${cur+1} 열림!`:""}`;
    app.querySelectorAll(".lv").forEach(b=>{const id=+b.dataset.id;if(cOpen(id)){b.disabled=false;b.classList.remove("locked")}});
    const nx=cur<LEVELS.length?cur+1:null,nb=$("#nextq");nb.textContent=nx?`다음 퀘스트로 → Lv.${nx}`:"홈으로";
    const ns=nextCook();$("#nextshop").innerHTML=ns&&ns.id!==cur?shopHTML(ns).replace("card shop","shop"):"";
    nb.onclick=()=>{if(nx){S.cookCur=nx;save();cook();window.scrollTo(0,0)}else home()};
    $("#after").scrollIntoView({behavior:"smooth",block:"center"});
  };
  app.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{const st=S.cook[cur]=S.cook[cur]||{};st.stars=+b.dataset.n;save();app.querySelectorAll(".rate button").forEach(x=>x.classList.toggle("on",+x.dataset.n<=st.stars))});
}

home();
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{})}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&document.querySelector("#ver"))home()});
